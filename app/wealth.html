<style>
/* Layout: a dark instrument rail on the left, one working surface on the right; every view opens with its answer,

:root {

  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0c1311; --surface: #131c19; --inset: #19241f; --ink: #e8efec; --ink2: #a8b7b1; --ink3: #7b8b85; --line: #22302b; --line2: #304039;
  --accent: #3fae96; --accent-soft: rgba(63, 174, 150, 0.14); --brass: #d6ad55; --brass-soft: rgba(214, 173, 85, 0.14); --pos: #3fb950; --neg: #f27272; --warn: #e0a339;
  --rail: #070c0b; --rail-hi: rgba(255, 255, 255, 0.06);
  --c-eq: #4a8be6; --c-bond: #9a83e0; --c-cash: #8a9a94; --c-re: #d98a52; --c-pm: #35a88f; --c-alt: #d06e9a; --c-crypto: #e0a93a; --c-pen: #6f9cc0; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0c1311; --surface: #131c19; --inset: #19241f; --ink: #e8efec; --ink2: #a8b7b1; --ink3: #7b8b85; --line: #22302b; --line2: #304039;
  --accent: #3fae96; --accent-soft: rgba(63, 174, 150, 0.14); --brass: #d6ad55; --brass-soft: rgba(214, 173, 85, 0.14); --pos: #3fb950; --neg: #f27272; --warn: #e0a339;
  --rail: #070c0b; --rail-hi: rgba(255, 255, 255, 0.06);

.vm.live { color: var(--pos); border-color: color-mix(in srgb, var(--pos) 40%, transparent); }
.vm.mtm { color: var(--brass); border-color: color-mix(in srgb, var(--brass) 50%, transparent); background: var(--brass-soft); }

.delta { font-size: 12px; color: var(--brass); }
input[type="number"], input[type="text"], select { background: var(--surface); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 8px; font-size: 13px; }

.addf { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }

/* backtest */
.bt { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }

.wrow { display: grid; grid-template-columns: 10px minmax(0, 1fr) 64px; gap: 8px; align-items: center; padding: 5px 0; font-size: 13px; }

.op i { width: 10px; height: 10px; border-radius: 50%; }
.op b { font-weight: 600; } .op small { color: var(--ink3); display: block; }
.op .u { font-weight: 600; color: var(--pos); font-variant-numeric: tabular-nums; text-align: right; }
.op .fit { font: 500 10.5px var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.dot { cursor: pointer; }
.dot:hover { stroke: var(--ink); stroke-width: 2; }
#tip { position: fixed; z-index: 60; pointer-events: none; background: var(--surface); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14); max-width: 280px; opacity: 0; }

.plans { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }

/* phone */
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; inset: auto 0 0 0; top: auto; height: auto; z-index: 40; flex-direction: row; gap: 0; padding-block: 6px calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }
  .logo, .rail .hh { display: none; }
  .nav { flex-direction: row; justify-content: space-between; width: 100%; }

  .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); }

<script>
const MARKET = /*__MARKET__*/null;
const RESEARCH = /*__RESEARCH__*/null;

/* ---------- formatting ---------- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = (x, d) => { const a = Math.abs(x), s = x < 0 ? '−' : ''; if (d === 'full') return s + '€' + Math.round(a).toLocaleString('en-GB'); if (a >= 1e6) return `${s}€${(a / 1e6).toFixed(a >= 1e7 ? 1 : 2)}m`; if (a >= 1e3) return `${s}€${Math.round(a / 1e3)}k`; return `${s}€${Math.round(a)}`; };
const sEur = (x) => (x >= 0 ? '+' : '') + eur(x);
const pct = (x, d = 1) => `${(x * 100).toFixed(d)}%`;
const sPct = (x, d = 1) => `${x >= 0 ? '+' : '−'}${Math.abs(x * 100).toFixed(d)}%`;
const cls = (x) => (x > 0.00001 ? 'pos' : x < -0.00001 ? 'neg' : '');
const store = { get(k, d) { try { const v = localStorage.getItem('pm-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('pm-' + k, JSON.stringify(v)); } catch (e) { /* optional */ } } };

/* ---------- asset classes ---------- */
const CLASSES = {
  cash: ['Cash & deposits', 'var(--c-cash)'], eq: ['Listed equities', 'var(--c-eq)'], bond: ['Bonds', 'var(--c-bond)'], re: ['Real estate', 'var(--c-re)'],
  pm: ['Private markets', 'var(--c-pm)'], alt: ['Collectibles', 'var(--c-alt)'], crypto: ['Crypto', 'var(--c-crypto)'], pen: ['Pension & insurance', 'var(--c-pen)'],
};
const M = MARKET, NOW = M.months.length - 1;
const px = (k, i) => { const s = M.series[k]; for (let j = Math.min(i, s.length - 1); j >= 0; j--) if (s[j] != null) return s[j]; return null; };
const monthIdx = (ym) => Math.max(0, M.months.indexOf(ym) >= 0 ? M.months.indexOf(ym) : M.months.findIndex((m) => m >= ym));
const btcEur = px('btc', NOW);

/* ---------- the demo household (illustrative figures, not a real family) ---------- */
const HH = { name: 'Rossi household', sub: 'Marco & Giulia · Milan', spend: 22000 };
const ACCOUNTS = [
  ['mandate', 'Discretionary mandate', 'Private bank, Lugano', 'Daily feed', 0.009],
  ['broker', 'Self-directed brokerage', 'Online broker', 'Daily feed', 0.0012],
  ['bank', 'Current accounts', 'Retail bank, Milan', 'Daily feed', 0],
  ['treasury', 'Treasury portfolio', 'Private bank, Milan', 'Daily feed', 0.003],
  ['pm', 'Private markets', 'Fund administrators', 'Quarterly statements', 0.02],
  ['realty', 'Property', 'Entered by you', 'Manual', 0],
  ['coll', 'Collectibles', 'Entered by you', 'Manual', 0],
  ['wallet', 'Crypto wallet', 'Cold storage', 'Address watch', 0],
  ['pension', 'Pension & insurance', 'Insurer', 'Annual statement', 0.012],
];
// mark: Base value, its date and source. mtm: how Premium rolls the mark forward to today.
const ASSETS = [
  { id: 'cur', n: 'Current account', a: 'bank', c: 'cash', v: 380000, ccy: { EUR: 1 }, days: 0, src: 'live' },
  { id: 'usd', n: 'USD deposit', a: 'bank', c: 'cash', v: 290000, ccy: { USD: 1 }, days: 0, src: 'live' },
  { id: 'mmf', n: 'Euro money-market fund', a: 'treasury', c: 'cash', v: 650000, ccy: { EUR: 1 }, days: 2, src: 'live', proxy: 'cash' },

const monthsBetween = (a, b) => { const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); };

}
function assets() {

  return list.map((x) => { const pv = S.plan === 'premium' ? premiumValue(x) : x.v; return { ...x, val: pv, uplift: pv - x.v }; });
}
const accountOf = (id) => { const a = ACCOUNTS.find((x) => x[0] === id); if (a) return a; if (id === 'manual') return ['manual', 'Added by you', 'Manual entry', 'Manual', 0]; if (id === 'live') return ['live', 'Scalable Capital', 'Connected live', 'Live', 0.0012]; return [id, id, '', '', 0]; };

  const uplift = A.reduce((s, x) => s + x.uplift, 0);

}
// net worth over the last 36 months: liquid holdings follow their market proxy; illiquid ones move only at their marks
function history(n) {
  const T = totals(), out = [];
  for (let k = n; k >= 0; k--) {
    const i = NOW - k; let v = 0;
    T.A.forEach((x) => {
      const p = x.proxy;
      if (p) { const w = typeof p === 'string' ? { [p]: 1 } : p; let f = 0; Object.entries(w).forEach(([key, wt]) => { f += wt * px(key, i) / px(key, NOW); }); v += x.val * f; return; }
      if (x.mark && monthIdx(x.mark) > i && S.plan === 'base') { v += x.val; return; }
      const q = Math.floor(i / 3) * 3, back = (NOW - q) / 12; // quarterly steps
      const r = x.mtm && x.mtm.rate != null ? x.mtm.rate : x.mtm && x.mtm.proxy ? null : 0;

      v += S.plan === 'premium' && r ? x.val / (1 + r) ** back : x.val;

}

function areaChart(host, rows, opts = {}) {

  let lo = Math.min(...all), hi = Math.max(...all); const pad = (hi - lo) * 0.08 || hi * 0.05; lo -= pad; hi += pad;
  const X = (i) => m.l + (i / (rows.length - 1)) * (w - m.l - m.r), Y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * (h - m.t - m.b);
  const step = (hi - lo) / 4, ticks = [0, 1, 2, 3, 4].map((k) => lo + step * k);
  const fmt = opts.fmt || ((v) => eur(v));
  let svg = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(opts.aria || 'Chart')}">`;
  ticks.forEach((t) => { svg += `<line class="gl" x1="${m.l}" x2="${w - m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${fmt(t)}</text>`; });
  const every = Math.max(1, Math.ceil(rows.length / (w < 500 ? 4 : 8)));
  rows.forEach((r, i) => { if ((i % every === 0 && rows.length - 1 - i >= every / 2) || i === rows.length - 1) svg += `<text x="${X(i)}" y="${h - 6}" text-anchor="${i === 0 ? 'start' : i === rows.length - 1 ? 'end' : 'middle'}">${esc(opts.xl ? opts.xl(r) : r.m)}</text>`; });
  lines.forEach((l) => {
    const pts = l.v.map((v, i) => (v == null ? null : [X(i), Y(v)])).filter(Boolean);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
    if (l.fill) svg += `<path d="${d}L${pts[pts.length - 1][0]} ${h - m.b}L${pts[0][0]} ${h - m.b}Z" fill="${l.color}" opacity="0.1"/>`;
    svg += `<path d="${d}" fill="none" stroke="${l.color}" stroke-width="${l.width || 2}" ${l.dash ? `stroke-dasharray="${l.dash}"` : ''} stroke-linejoin="round"/>`;
    const e = pts[pts.length - 1]; svg += `<circle cx="${e[0]}" cy="${e[1]}" r="3.5" fill="${l.color}"/>`;
  });
  host.innerHTML = svg + '</svg>';
}

    const h = await call('get_portfolio_holdings'); let cash = 0; try { const c = await call('get_portfolio_cash_breakdown'); cash = (c && c.cash && c.cash.cashBalance) || 0; } catch (e) { /* cash is optional */ }
    const rows = ((h && h.holdings) || []).filter((x) => x.position && x.position.filled > 0).map((x) => ({ id: x.isin, n: x.name, s: `${x.position.filled} shares · bought at €${(+x.fifoPrice).toFixed(2)}`, a: 'live', c: 'eq', v: +x.valuation, ccy: { USD: /^US|^CA|^KY/.test(x.isin) ? 1 : 0, EUR: /^US|^CA|^KY/.test(x.isin) ? 0 : 1 }, days: 2, src: 'live', proxy: /^US/.test(x.isin) ? 'usEq' : 'intlEq' }));

    render(); $('#conn-msg').textContent = `Connected: ${rows.length} holdings from your Scalable Capital account replace the demo brokerage.`;

}

/* ---------- allocation ---------- */

/* ---------- backtest ---------- */
const PROXY_COLOR = { usEq: 'var(--c-eq)', intlEq: '#6fa0e8', emEq: '#9cc0f0', bonds: 'var(--c-bond)', gold: 'var(--brass)', reits: 'var(--c-re)', listedPE: 'var(--c-pm)', cash: 'var(--c-cash)', btc: 'var(--c-crypto)' };
function yourMix() {
  const T = totals(), w = {}; const add = (k, x) => { w[k] = (w[k] || 0) + x; };
  T.A.forEach((x) => { if (x.proxy) { const p = typeof x.proxy === 'string' ? { [x.proxy]: 1 } : x.proxy; Object.entries(p).forEach(([k, f]) => add(k, x.val * f)); } else if (x.c === 'cash') add('cash', x.val); else if (x.c === 're') add('reits', x.val); else if (x.c === 'pm') add(x.id === 'credit' ? 'bonds' : 'listedPE', x.val); else if (x.c === 'pen') { add('bonds', x.val * 0.5); add('usEq', x.val * 0.5); } });
  const s = Object.values(w).reduce((a, b) => a + b, 0); return Object.fromEntries(Object.entries(w).map(([k, x]) => [k, Math.round((x / s) * 100)]));
}
const PRESETS = { yours: ['Your wealth, proxied', null], sixty: ['60 / 40', { usEq: 36, intlEq: 24, bonds: 40 }], endow: ['Endowment style', { usEq: 20, intlEq: 15, emEq: 10, bonds: 15, listedPE: 20, reits: 10, gold: 5, cash: 5 }], allw: ['All-weather', { usEq: 18, intlEq: 12, bonds: 55, gold: 15 }] };
function simulate(w, from) {
  const keys = Object.keys(w).filter((k) => w[k] > 0), tot = keys.reduce((s, k) => s + w[k], 0) || 1;
  let i0 = monthIdx(from); keys.forEach((k) => { const f = M.series[k].findIndex((x) => x != null); if (f > i0) i0 = f; });
  let val = 1e6, hold = Object.fromEntries(keys.map((k) => [k, val * w[k] / tot])); const curve = [{ m: M.months[i0], v: val }];
  for (let i = i0 + 1; i <= NOW; i++) {
    keys.forEach((k) => { hold[k] *= px(k, i) / px(k, i - 1); });
    val = keys.reduce((s, k) => s + hold[k], 0);
    if (M.months[i].endsWith('-12')) hold = Object.fromEntries(keys.map((k) => [k, val * w[k] / tot])); // rebalance each December
    curve.push({ m: M.months[i], v: val });
  }
  const r = curve.slice(1).map((c, j) => c.v / curve[j].v - 1), yrs = (curve.length - 1) / 12;
  const mean = r.reduce((s, x) => s + x, 0) / r.length, vol = Math.sqrt(r.reduce((s, x) => s + (x - mean) ** 2, 0) / (r.length - 1)) * Math.sqrt(12);
  let peak = 0, mdd = 0; curve.forEach((c) => { peak = Math.max(peak, c.v); mdd = Math.min(mdd, c.v / peak - 1); });
  let w12 = Infinity; for (let j = 12; j < curve.length; j++) w12 = Math.min(w12, curve[j].v / curve[j - 12].v - 1);
  return { curve, cagr: (val / 1e6) ** (1 / yrs) - 1, vol, mdd, w12, end: val, from: curve[0].m };
}
function backtest(v) {
  if (!S.mix) S.mix = { preset: 'yours', w: yourMix() };
  const w = S.mix.w, tot = Object.values(w).reduce((s, x) => s + (+x || 0), 0);
  const a = simulate(w, S.btFrom), b = simulate(PRESETS.sixty[1], a.from);
  const years = ['2008-01', '2010-01', '2015-01', '2020-01'];
  v.innerHTML = `<div class="view">
    <div class="vh"><div><h1>€1m in this mix since ${a.from.slice(0, 4)} became ${eur(a.end)}</h1><p>Real monthly returns in euro, dividends reinvested, rebalanced every December. Illiquid assets are stood in for by their listed cousins.</p></div>
      <div class="who"><div class="seg" role="group" aria-label="Start">${years.map((y) => `<button data-from="${y}" aria-pressed="${S.btFrom === y}">From ${y.slice(0, 4)}</button>`).join('')}</div>${a.from > S.btFrom ? `<span class="badge demo">Starts ${a.from}: Bitcoin prices begin then</span>` : ''}</div></div>
    <div class="bt">
      <div class="card"><h2>The mix</h2><div class="seg" role="group" aria-label="Preset" style="flex-wrap:wrap;margin-bottom:10px">${Object.entries(PRESETS).map(([k, [l]]) => `<button data-pre="${k}" aria-pressed="${S.mix.preset === k}">${l}</button>`).join('')}</div>
        ${Object.keys(PROXY_COLOR).map((k) => `<label class="wrow"><i style="background:${PROXY_COLOR[k]}"></i><span>${esc(M.meta[k].name)}${k === 'btc' ? ' <small class="muted">from 2014</small>' : ''}</span><input type="number" min="0" max="100" step="1" value="${w[k] || 0}" data-w="${k}" aria-label="${esc(M.meta[k].name)} weight, per cent"></label>`).join('')}
        <div class="wsum"><span>Total</span><b class="${Math.abs(tot - 100) < 0.5 ? '' : 'neg'}">${tot}%${Math.abs(tot - 100) < 0.5 ? '' : ' · scaled to 100%'}</b></div></div>
      <div class="card"><div class="lg"><span><i style="background:var(--accent)"></i>This mix</span><span><i style="background:var(--ink3)"></i>60 / 40 for comparison</span></div><div class="chart" id="btc"></div>
        <div class="stats" style="margin-top:14px">
          <div class="stat"><span class="lbl">A year, on average</span><b class="${cls(a.cagr)}">${sPct(a.cagr)}</b><small>60/40: ${sPct(b.cagr)}</small></div>
          <div class="stat"><span class="lbl">Swings (volatility)</span><b>${pct(a.vol)}</b><small>60/40: ${pct(b.vol)}</small></div>
          <div class="stat"><span class="lbl">Deepest fall</span><b class="neg">${sPct(a.mdd)}</b><small>60/40: ${sPct(b.mdd)}</small></div>
          <div class="stat"><span class="lbl">Worst 12 months</span><b class="neg">${sPct(a.w12)}</b><small>60/40: ${sPct(b.w12)}</small></div>
          <div class="stat"><span class="lbl">€1m became</span><b>${eur(a.end)}</b><small>60/40: ${eur(b.end)}</small></div>
        </div></div>
    </div></div>`;
  areaChart($('#btc'), a.curve, { h: 280, aria: 'Growth of €1m', lines: [{ v: a.curve.map((c) => c.v), color: 'var(--accent)', fill: true }, { v: b.curve.map((c) => c.v), color: 'var(--ink3)', width: 1.5, dash: '4 4' }], xl: (r) => r.m.slice(0, 4) });
  $$('[data-from]').forEach((x) => x.addEventListener('click', () => { S.btFrom = x.dataset.from; store.set('btFrom', S.btFrom); render(); }));
  $$('[data-pre]').forEach((x) => x.addEventListener('click', () => { const k = x.dataset.pre; S.mix = { preset: k, w: k === 'yours' ? yourMix() : { ...PRESETS[k][1] } }; store.set('mix', S.mix); render(); }));
  $$('[data-w]').forEach((x) => x.addEventListener('change', () => { S.mix.w[x.dataset.w] = Math.max(0, +x.value || 0); S.mix.preset = 'custom'; store.set('mix', S.mix); render(); }));
}

function opportunities(v) {

    <div class="grid">
      <div class="card s7"><h2>Listed stocks <small>upside to analyst target</small></h2><div class="ops">${listed.filter((x) => x.r != null).slice(0, 12).map((x) => `<div class="op"><i style="background:${CLASSES.eq[1]}"></i><span><b>${esc(x.n)}</b> <span class="muted">${esc(x.tk)}</span><small>${esc(x.t)}</small></span>${x.top ? '<span class="fit">Top five</span>' : '<span></span>'}<span class="u">${sPct(x.r, 0)}</span></div>`).join('')}</div></div>
      <div class="card s5"><h2>Private deals <small>target return a year</small></h2><div class="ops">${DEALS.map((x) => `<div class="op"><i style="background:${CLASSES[x.c][1]}"></i><span><b>${esc(x.n)}</b><small>${esc(x.t)}</small></span>${under.includes(x.fit) ? '<span class="fit">Fills a gap</span>' : '<span></span>'}<span class="u">${sPct(x.r, 0)}</span></div>`).join('')}</div><p class="muted" style="margin:10px 0 0;font-size:12.5px">Examples for the demo, not live offers.</p></div>
    </div></div>`;
  scatter($('#opm'), all);
}
function parseUp(s) { const m = /([+−-]\s?\d+(?:\.\d+)?)%/.exec(String(s || '')); return m ? parseFloat(m[1].replace('−', '-').replace(/\s/g, '')) / 100 : null; }
function scatter(host, pts) {
  const w = host.clientWidth || 700, h = 320, m = { l: 48, r: 16, t: 14, b: 34 };
  const xs = [1, 30, 365, 3650], lx = (d) => Math.log10(Math.max(1, d)), X = (d) => m.l + (lx(d) / lx(4000)) * (w - m.l - m.r);
  const hi = Math.max(1.2, ...pts.map((p) => p.r)), Y = (r) => m.t + (1 - r / hi) * (h - m.t - m.b);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Opportunities by expected return and lock-up">`;
  [0, 0.25, 0.5, 0.75, 1].filter((t) => t <= hi).forEach((t) => { s += `<line class="gl" x1="${m.l}" x2="${w - m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${Math.round(t * 100)}%</text>`; });
  [['1 day', 1], ['1 month', 30], ['1 year', 365], ['10 years', 3650]].forEach(([l, d]) => { s += `<text x="${X(d)}" y="${h - 14}" text-anchor="middle">${l}</text>`; });
  s += `<text x="${w - m.r}" y="${h - 1}" text-anchor="end">money tied up →</text>`;
  pts.forEach((p, i) => { const jit = p.days < 5 ? ((i * 37) % 23) - 11 : 0; s += `<circle class="dot" data-i="${i}" cx="${X(p.days) + jit * 2.2}" cy="${Y(p.r)}" r="${p.top ? 8 : 5.5}" fill="${CLASSES[p.c][1]}" fill-opacity="0.82"/>`; });
  host.innerHTML = s + '</svg>';
  $$('.dot', host).forEach((d) => { const p = pts[+d.dataset.i]; d.addEventListener('pointermove', (e) => tip(`<b>${esc(p.n)}</b>${p.tk ? ' ' + esc(p.tk) : ''}<br>${sPct(p.r, 0)} · ${esc(p.t || '')}`, e)); d.addEventListener('pointerleave', () => tip(null)); });
}
