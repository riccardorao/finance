<title>CFA Prep Tracker</title>
<meta name="description" content="Track your CFA Level I, II and III preparation: study hours, syllabus coverage, mock exams and your chance of passing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky ledger-style tab bar; each level is a working page: verdict strip, charts, topic grid, logs. */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --surface-2: #EAEEF3;
  --ink: #131A24;
  --ink-2: #445063;
  --muted: #6E7A8C;
  --line: #D9DFE7;
  --accent: #14558F;
  --accent-soft: #DCE8F4;
  --proj: #7A5BB5;
  --good: #1D7A4C;
  --good-soft: #DDF1E5;
  --warn: #9A6200;
  --warn-soft: #F8EBCF;
  --bad: #B3362E;
  --bad-soft: #F8DEDB;
  --f-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1219; --surface: #151C26; --surface-2: #1D2633; --ink: #E7EBF1; --ink-2: #AEB8C6; --muted: #7F8A9B;
    --line: #283343; --accent: #6DB3E8; --accent-soft: #1A3047; --proj: #B39BE6;
    --good: #5CC98F; --good-soft: #163626; --warn: #E3AE4A; --warn-soft: #3A2D12; --bad: #F2837A; --bad-soft: #3D1D1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1219; --surface: #151C26; --surface-2: #1D2633; --ink: #E7EBF1; --ink-2: #AEB8C6; --muted: #7F8A9B;
  --line: #283343; --accent: #6DB3E8; --accent-soft: #1A3047; --proj: #B39BE6;
  --good: #5CC98F; --good-soft: #163626; --warn: #E3AE4A; --warn-soft: #3A2D12; --bad: #F2837A; --bad-soft: #3D1D1B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.7rem, 3.5vw, 2.3rem); line-height: 1.15; }
h2 { font-size: 1.35rem; line-height: 1.25; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
a { color: var(--accent); }
.num, td.n, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px 0; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 6px 24px; }
.brand { display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px; }
.brand b { font-family: var(--f-display); font-size: 1.2rem; font-weight: 650; }
.brand span { font-size: 0.8rem; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
nav.tabs button { appearance: none; border: 0; background: none; font: inherit; font-weight: 500; color: var(--ink-2); padding: 10px 14px 11px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

main { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: grid; gap: 22px; }
section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 16px; min-width: 0; align-content: start; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 22px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; }

/* Banner */
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 12px 16px; border-radius: var(--r); background: var(--accent-soft); color: var(--ink); border: 1px solid var(--line); }
.banner .acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* Controls */
button.btn { appearance: none; font: inherit; font-weight: 600; font-size: 0.88rem; padding: 8px 14px; border-radius: var(--r); border: 1px solid var(--accent); background: var(--accent); color: var(--surface); cursor: pointer; }
button.btn.ghost { background: transparent; color: var(--accent); }
button.btn.quiet { background: transparent; color: var(--ink-2); border-color: var(--line); }
button.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
button.btn:disabled { opacity: 0.5; cursor: default; }
button.link { appearance: none; border: 0; background: none; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
button.x { appearance: none; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 4px 6px; border-radius: 4px; }
button.x:hover { color: var(--bad); background: var(--bad-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { font: inherit; font-size: 0.9rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 7px 9px; min-width: 0; }
input[type="number"] { font-family: var(--f-mono); }
input[type="range"] { padding: 0; accent-color: var(--accent); border: 0; background: transparent; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 0.75rem; font-weight: 600; color: var(--ink-2); }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 10px; align-items: end; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 12px; }

/* Verdict */
.verdict { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2fr); gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.verdict .big { padding: 22px; display: grid; gap: 8px; align-content: start; border-right: 1px solid var(--line); }
.verdict .big .pct { font-family: var(--f-display); font-size: 3.6rem; line-height: 1; font-weight: 650; font-variant-numeric: tabular-nums; }
.verdict .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpi { padding: 16px 18px; border-left: 1px solid var(--line); border-top: 1px solid var(--line); display: grid; gap: 4px; align-content: start; min-width: 0; }
.kpi:nth-child(-n+3) { border-top: 0; }
.kpi:nth-child(3n+1) { border-left: 0; }
.kpi .v { font-family: var(--f-mono); font-size: 1.35rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 0.8rem; color: var(--muted); }
@media (max-width: 760px) {
  .verdict { grid-template-columns: 1fr; }
  .verdict .big { border-right: 0; border-bottom: 1px solid var(--line); }
  .verdict .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { border-left: 1px solid var(--line) !important; border-top: 1px solid var(--line) !important; }
  .kpi:nth-child(2n+1) { border-left: 0 !important; }
  .kpi:nth-child(-n+2) { border-top: 0 !important; }
}
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); width: fit-content; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }
.bar > i.proj { background: var(--proj); opacity: 0.35; }

/* Tables */
.tbl-wrap { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th.n, td.n { text-align: right; }
.topics td input[type="number"] { width: 72px; }
.topics td select { width: 64px; }
.cov { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.cov input { flex: 1; }
.cov output { font-family: var(--f-mono); font-size: 0.82rem; width: 40px; text-align: right; }
.score-chip { font-family: var(--f-mono); font-size: 0.82rem; padding: 2px 7px; border-radius: 4px; }
.score-chip.good { background: var(--good-soft); color: var(--good); }
.score-chip.warn { background: var(--warn-soft); color: var(--warn); }
.score-chip.bad { background: var(--bad-soft); color: var(--bad); }

/* Charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ref { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .series { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: 0.1; }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .pace { stroke: var(--proj); stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
.chart .projdot { fill: var(--surface); stroke: var(--proj); stroke-width: 2; }
.chart .today { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .hit { fill: transparent; cursor: default; }
.chart text.lab { fill: var(--ink-2); font-family: var(--f-body); font-size: 11.5px; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.8rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 18px; height: 0; border-top: 2px solid var(--accent); }
.legend i.dash { border-top: 2px dashed var(--proj); }
.legend i.ref { border-top: 2px dashed var(--ink-2); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); font-size: 0.9rem; }
#tip { position: fixed; pointer-events: none; z-index: 50; background: var(--ink); color: var(--bg); font-size: 0.8rem; padding: 6px 9px; border-radius: 5px; max-width: 240px; line-height: 1.35; }

/* Overview */
.level-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; align-content: start; }
.level-card header { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.level-card .roman { font-family: var(--f-display); font-size: 2.6rem; line-height: 0.9; color: var(--accent); font-weight: 650; }
.level-card dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 0.88rem; }
.level-card dt { color: var(--muted); }
.level-card dd { margin: 0; text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.journey { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.journey div { padding: 14px 16px; display: grid; gap: 4px; border-left: 1px solid var(--line); min-width: 0; }
.journey div:first-child { border-left: 0; }
.hero { display: grid; gap: 10px; }
.hero p { color: var(--ink-2); max-width: 65ch; }

.focus { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.focus li { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); }
.focus li b { grid-row: span 2; font-family: var(--f-mono); color: var(--accent); }
details.method summary { cursor: pointer; font-weight: 600; color: var(--ink-2); }
details.method { font-size: 0.88rem; color: var(--ink-2); }
details.method ol, details.method ul { padding-left: 1.2rem; display: grid; gap: 6px; max-width: 75ch; }
details.mock-topics { grid-column: 1 / -1; }
details.mock-topics summary { cursor: pointer; font-size: 0.85rem; color: var(--accent); font-weight: 600; }
.mt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 8px; margin-top: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--r); display: flex; gap: 14px; align-items: center; z-index: 60; font-size: 0.88rem; max-width: calc(100% - 32px); }
.toast button { appearance: none; background: none; border: 0; color: var(--bg); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
footer.foot { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; color: var(--muted); font-size: 0.8rem; display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .3s ease; } }
@media (max-width: 560px) { .journey { grid-template-columns: 1fr; } .journey div { border-left: 0; border-top: 1px solid var(--line); } .journey div:first-child { border-top: 0; } section.panel { padding: 16px; } }
</style>

  <div class="top-in">
    <div class="brand"><b>CFA Prep Tracker</b><span>Levels I · II · III</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
(function () {
"use strict";

/* ---------- Curriculum ---------- */
const PATHWAYS = { pm: "Portfolio Management", pmk: "Private Markets", pw: "Private Wealth" };
const LEVELS = {
  1: {
    name: "Level I", roman: "I", hours: 300, mps: 70, guess: 33.3,
    format: "180 multiple-choice questions in two 2h 15m sessions",
    topics: [
      ["ethics", "Ethical & Professional Standards", 15, 20], ["quant", "Quantitative Methods", 6, 9],
      ["econ", "Economics", 6, 9], ["fsa", "Financial Statement Analysis", 11, 14],
      ["corp", "Corporate Issuers", 6, 9], ["equity", "Equity Investments", 11, 14],
      ["fi", "Fixed Income", 11, 14], ["deriv", "Derivatives", 5, 8],
      ["alts", "Alternative Investments", 7, 10], ["pm", "Portfolio Management", 8, 12]
    ]
  },
  2: {
    name: "Level II", roman: "II", hours: 325, mps: 70, guess: 33.3,
    format: "88 item-set questions (22 vignettes) in two 2h 12m sessions",
    topics: [
      ["ethics", "Ethical & Professional Standards", 10, 15], ["quant", "Quantitative Methods", 5, 10],
      ["econ", "Economics", 5, 10], ["fsa", "Financial Statement Analysis", 10, 15],
      ["corp", "Corporate Issuers", 5, 10], ["equity", "Equity Valuation", 10, 15],
      ["fi", "Fixed Income", 10, 15], ["deriv", "Derivatives", 5, 10],
      ["alts", "Alternative Investments", 5, 10], ["pm", "Portfolio Management", 10, 15]
    ]
  },
  3: {
    name: "Level III", roman: "III", hours: 350, mps: 65, guess: 25,
    format: "Item sets and constructed-response (essay) questions in two sessions",
    topics: [
      ["aa", "Asset Allocation", 15, 20], ["pc", "Portfolio Construction", 15, 20],
      ["perf", "Performance Measurement", 5, 10], ["drm", "Derivatives & Risk Management", 10, 15],
      ["ethics", "Ethical & Professional Standards", 10, 15], ["path", "Pathway", 30, 35]
    ]
  }
};
const KINDS = ["Reading", "Practice questions", "Mock exam", "Review", "Video lecture"];
const STATUS = { "not-started": "Not started", studying: "Studying", passed: "Passed", "not-passed": "Did not pass" };

function topicsFor(id, lv) {
  const L = LEVELS[id];
  const sum = L.topics.reduce((s, t) => s + (t[2] + t[3]) / 2, 0);
  return L.topics.map(([tid, name, lo, hi]) => ({
    id: tid, lo, hi, w: (lo + hi) / 2 / sum,
    name: tid === "path" ? PATHWAYS[lv.pathway || "pm"] + " pathway" : name
  }));
}

/* ---------- Dates & formatting ---------- */
const DAY = 86400000;
function today() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function parse(s) { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return y ? new Date(y, m - 1, d) : null; }
function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function fmtDate(s) { const d = typeof s === "string" ? parse(s) : s; return d ? d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "—"; }
function fmtShort(d) { return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
const nf1 = new Intl.NumberFormat("en-GB", { maximumFractionDigits: 1, minimumFractionDigits: 1 });
const nf0 = new Intl.NumberFormat("en-GB", { maximumFractionDigits: 0 });
function pct(v, d) { return v == null || isNaN(v) ? "—" : (d === 0 ? nf0.format(v) : nf1.format(v)) + "%"; }
function hrs(v) { return v == null ? "—" : nf0.format(v) + " h"; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function uid() { return Math.random().toString(36).slice(2, 10); }

/* ---------- State ---------- */
const KEY = "cfa-prep-tracker-v1";
function blankLevel(id) {
  const topics = {};
  LEVELS[id].topics.forEach(t => { topics[t[0]] = { cov: 0, conf: 0, prac: null }; });
  return { status: "not-started", examDate: "", targetHours: LEVELS[id].hours, mps: LEVELS[id].mps, pathway: "pm", topics, sessions: [], mocks: [] };
}
function blankState() { return { v: 1, example: false, name: "", levels: { 1: blankLevel(1), 2: blankLevel(2), 3: blankLevel(3) } }; }

function exampleState() {
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const t = today();
  const s = blankState();
  s.example = true;
  s.name = "Example candidate";

  // Level I: passed earlier this year
  const l1 = s.levels[1];
  l1.status = "passed";
  const l1exam = addDays(t, -150);
  l1.examDate = iso(l1exam);
  const l1ids = LEVELS[1].topics.map(x => x[0]);
  for (let d = -125; d < 0; d += 2) {
    l1.sessions.push({ id: uid(), date: iso(addDays(l1exam, d)), topic: l1ids[Math.floor(rnd() * l1ids.length)], kind: KINDS[Math.floor(rnd() * 4)], hours: Math.round((3 + rnd() * 3) * 4) / 4, notes: "" });
  }
  l1ids.forEach(id => { l1.topics[id] = { cov: 100, conf: 4, prac: Math.round(68 + rnd() * 16) }; });
  [[-35, "CFA Institute mock A", 66], [-21, "Third-party mock 1", 70], [-9, "CFA Institute mock B", 74]].forEach(([d, p, sc]) => {
    const tp = {}; l1ids.forEach(id => { tp[id] = Math.round(clamp(sc + (rnd() - 0.5) * 22, 35, 98)); });
    l1.mocks.push({ id: uid(), date: iso(addDays(l1exam, d)), provider: p, score: sc, topics: tp });
  });

  // Level II: studying, exam in seven weeks
  const l2 = s.levels[2];
  l2.status = "studying";
  l2.examDate = iso(addDays(t, 49));
  const cov = { ethics: 80, quant: 100, econ: 100, fsa: 100, corp: 100, equity: 90, fi: 70, deriv: 45, alts: 30, pm: 20 };
  const conf = { ethics: 3, quant: 4, econ: 4, fsa: 3, corp: 4, equity: 3, fi: 2, deriv: 2, alts: 2, pm: 1 };
  const prac = { ethics: 64, quant: 76, econ: 72, fsa: 61, corp: 74, equity: 66, fi: 58, deriv: 52, alts: null, pm: null };
  Object.keys(cov).forEach(id => { l2.topics[id] = { cov: cov[id], conf: conf[id], prac: prac[id] }; });
  const order = ["quant", "econ", "corp", "fsa", "equity", "ethics", "fi", "deriv", "alts", "pm"];
  for (let d = -118; d <= -1; d += 1) {
    if (rnd() < 0.45) continue;
    const prog = (d + 118) / 118;
    const id = order[Math.min(order.length - 1, Math.floor(prog * 9.5 + (rnd() - 0.5) * 2))] || "quant";
    l2.sessions.push({ id: uid(), date: iso(addDays(t, d)), topic: rnd() < 0.12 ? "mixed" : id, kind: d > -45 && rnd() < 0.4 ? "Practice questions" : KINDS[Math.floor(rnd() * 2) === 0 ? 0 : 4], hours: Math.round((1.5 + rnd() * 2.5) * 4) / 4, notes: "" });
  }
  [[-40, "Third-party mock 1", 57, { ethics: 58, quant: 70, econ: 66, fsa: 55, corp: 68, equity: 60, fi: 50, deriv: 40, alts: 45, pm: 42 }],
   [-20, "CFA Institute mock A", 62, { ethics: 63, quant: 74, econ: 70, fsa: 60, corp: 72, equity: 64, fi: 56, deriv: 46, alts: 48, pm: 45 }],
   [-6, "Third-party mock 2", 65, { ethics: 66, quant: 77, econ: 72, fsa: 62, corp: 75, equity: 68, fi: 60, deriv: 52, alts: 50, pm: 48 }]
  ].forEach(([d, p, sc, tp]) => l2.mocks.push({ id: uid(), date: iso(addDays(t, d)), provider: p, score: sc, topics: tp }));
  return s;
}

let state;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.levels) {
        [1, 2, 3].forEach(id => {
          const b = blankLevel(id);
          s.levels[id] = Object.assign(b, s.levels[id] || {});
          LEVELS[id].topics.forEach(t => { if (!s.levels[id].topics[t[0]]) s.levels[id].topics[t[0]] = { cov: 0, conf: 0, prac: null }; });
        });
        return s;
      }
    }
  } catch (e) { /* storage unavailable */ }
  return exampleState();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* in-memory only */ } }
state = load();

/* ---------- Model ---------- */
function phi(z) {
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989423 * Math.exp(-z * z / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return z > 0 ? 1 - p : p;
}

function compute(id) {
  const lv = state.levels[id], L = LEVELS[id], g = L.guess;
  const T = topicsFor(id, lv);
  const now = today();
  const exam = parse(lv.examDate);
  const daysLeft = exam ? Math.round((exam - now) / DAY) : null;
  const upcoming = daysLeft != null && daysLeft > 0;
  const weeksLeft = upcoming ? daysLeft / 7 : 0;
  const mps = Number(lv.mps) || L.mps;
  const target = Number(lv.targetHours) || L.hours;

  const sessions = lv.sessions.slice().sort((a, b) => a.date.localeCompare(b.date));
  const mocks = lv.mocks.slice().sort((a, b) => a.date.localeCompare(b.date));
  const H = sessions.reduce((s, x) => s + (Number(x.hours) || 0), 0);
  const ref = upcoming || !exam ? now : exam;
  const cutoff = addDays(ref, -28);
  const recent = sessions.filter(x => { const d = parse(x.date); return d > cutoff && d <= ref; });
  const rate = recent.reduce((s, x) => s + (Number(x.hours) || 0), 0) / 4;

  const C = T.reduce((s, t) => s + t.w * (Number(lv.topics[t.id].cov) || 0) / 100, 0);

  // Per-topic score: latest mock topic score, else practice score
  const rows = T.map(t => {
    const tp = lv.topics[t.id];
    let mockScore = null;
    for (let i = mocks.length - 1; i >= 0; i--) { const v = mocks[i].topics && mocks[i].topics[t.id]; if (v != null && v !== "") { mockScore = Number(v); break; } }
    const prac = tp.prac == null || tp.prac === "" ? null : Number(tp.prac);
    const score = mockScore != null ? mockScore : prac;
    const h = sessions.filter(x => x.topic === t.id).reduce((s, x) => s + (Number(x.hours) || 0), 0);
    return Object.assign({}, t, { cov: Number(tp.cov) || 0, conf: Number(tp.conf) || 0, prac, mockScore, score, hours: h });
  });
  const scored = rows.filter(r => r.score != null);
  const Wt = scored.reduce((s, r) => s + r.w, 0);
  const Tw = Wt > 0 ? scored.reduce((s, r) => s + r.w * r.score, 0) / Wt : null;

  // Mock average, recent mocks weighted more heavily
  const last = mocks.slice(-5);
  let M = null, sd = 0;
  if (last.length) {
    let ws = 0, acc = 0;
    last.forEach((m, i) => { ws += i + 1; acc += (i + 1) * Number(m.score); });
    M = acc / ws;
    if (last.length > 1) {
      const mean = last.reduce((s, m) => s + Number(m.score), 0) / last.length;
      sd = Math.sqrt(last.reduce((s, m) => s + (Number(m.score) - mean) ** 2, 0) / (last.length - 1));
    }
  }

  let Enow = null, source = "none";
  if (M != null) { Enow = Wt >= 0.5 ? 0.7 * M + 0.3 * Tw : M; source = Wt >= 0.5 ? "mocks+topics" : "mocks"; }
  else if (Wt >= 0.3) { Enow = C * Tw + (1 - C) * g; source = "practice"; }

  // Mock trend (points per week)
  let slope = null;
  if (mocks.length >= 3) {
    const pts = mocks.slice(-5).map(m => [(parse(m.date) - now) / DAY / 7, Number(m.score)]);
    const mx = pts.reduce((s, p) => s + p[0], 0) / pts.length, my = pts.reduce((s, p) => s + p[1], 0) / pts.length;
    const num = pts.reduce((s, p) => s + (p[0] - mx) * (p[1] - my), 0), den = pts.reduce((s, p) => s + (p[0] - mx) ** 2, 0);
    slope = den > 0 ? clamp(num / den, -1.5, 1.5) : 0;
  }

  // Projection to exam day
  let Hx = H, Cx = C, Eexam = Enow, gain = 0, penalty = 0;
  if (upcoming) {
    const add = rate * weeksLeft;
    Hx = H + add;
    const hpc = C > 0.05 && H > 0 ? H / C : target * 0.85;
    Cx = Math.min(1, C + add / hpc);
    if (Enow != null) {
      const K = C > 0.2 ? clamp((Enow - (1 - C) * g) / C, g, 95) : Enow;
      gain = slope != null ? clamp(slope * weeksLeft * 0.5, -3, 4) : clamp(add / 60, 0, 3) * (Cx >= 0.999 ? 1 : 0.5);
      if (Hx < 0.75 * target) penalty = -Math.min(4, (0.75 - Hx / target) * 16);
      if (Cx - C > 0.1) gain = Math.min(gain, 2);
      Eexam = clamp(Enow + 0.8 * (Cx - C) * Math.max(0, K - g) + gain + penalty, 0, 100);
    }
  }
  const sigma = Math.sqrt((M != null ? 5 : 7) ** 2 + (sd * 0.6) ** 2 + (upcoming ? Math.min(4, weeksLeft * 0.25) : 0) ** 2);
  const P = Eexam != null ? phi((Eexam - mps) / sigma) : null;

  let band;
  if (lv.status === "passed") band = { k: "good", t: "Passed" };
  else if (lv.status === "not-passed") band = { k: "bad", t: "Did not pass" };
  else if (P == null) band = { k: "", t: "Not enough data" };
  else if (P >= 0.75) band = { k: "good", t: "On track" };
  else if (P >= 0.5) band = { k: "warn", t: "Borderline" };
  else band = { k: "bad", t: "At risk" };

  // Focus areas
  const focus = rows.map(r => {
    const est = r.score != null ? r.score : g + (r.cov / 100) * (mps - g);
    const pr = r.w * Math.max(0, mps + 5 - est) + r.w * (100 - r.cov) * 0.25 + r.w * (5 - (r.conf || 0)) * 1.5;
    const why = [];
    if (r.score != null && r.score < mps) why.push("scoring " + pct(r.score, 0) + " against a " + pct(mps, 0) + " pass line");
    if (r.cov < 100) why.push(pct(r.cov, 0) + " of readings covered");
    if (r.score == null) why.push("no practice or mock score yet");
    if (r.conf && r.conf <= 2) why.push("confidence " + r.conf + "/5");
    return { r, pr, why };
  }).filter(f => f.pr > 0.4 && f.why.length).sort((a, b) => b.pr - a.pr).slice(0, 4);

  const byKind = {};
  sessions.forEach(x => { byKind[x.kind] = (byKind[x.kind] || 0) + (Number(x.hours) || 0); });

  return { id, lv, L, T, rows, now, exam, daysLeft, upcoming, weeksLeft, mps, target, sessions, mocks, H, rate, C, Cx, Hx, M, Tw, Wt, Enow, Eexam, sigma, P, band, slope, gain, penalty, source, focus, byKind, g };
}

function weeklyNeeded(r) {
  if (!r.upcoming) return null;
  return Math.max(0, (r.target - r.H) / Math.max(r.weeksLeft, 0.14));
}
function scoreClass(v, mps) { return v == null ? "" : v >= mps + 5 ? "good" : v >= mps - 5 ? "warn" : "bad"; }

/* ---------- Charts ---------- */
function mockChart(r) {
  if (!r.mocks.length) return '<div class="empty">No mock exams yet. Add your first one below to see your score trend against the pass line.</div>';
  const W = 640, Hh = 230, ml = 38, mr = 86, mt = 14, mb = 28;
  const d0 = parse(r.mocks[0].date);
  let d1 = r.upcoming ? r.exam : parse(r.mocks[r.mocks.length - 1].date);
  if (r.exam && !r.upcoming && r.exam > d1) d1 = r.exam;
  const span = Math.max(14 * DAY, d1 - d0);
  const x0 = new Date(+d0 - span * 0.06), x1 = new Date(+d1 + span * 0.04);
  const minS = Math.min(r.mps, ...r.mocks.map(m => +m.score), r.Eexam || 100);
  const y0 = minS < 45 ? 20 : 40, y1 = 100;
  const X = d => ml + (W - ml - mr) * ((d - x0) / (x1 - x0));
  const Y = v => mt + (Hh - mt - mb) * (1 - (v - y0) / (y1 - y0));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Mock exam scores over time against the minimum passing score">`;
  for (let v = y0; v <= y1; v += 10) s += `<line class="grid" x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${ml - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) { const d = new Date(+x0 + (x1 - x0) * (i / ticks)); s += `<text x="${X(d)}" y="${Hh - 8}" text-anchor="middle">${fmtShort(d)}</text>`; }
  s += `<line class="ref" x1="${ml}" x2="${W - mr}" y1="${Y(r.mps)}" y2="${Y(r.mps)}"/><text class="lab" x="${W - mr + 6}" y="${Y(r.mps) + 4}">Pass ${r.mps}%</text>`;
  if (r.upcoming && r.now >= x0) s += `<line class="today" x1="${X(r.now)}" x2="${X(r.now)}" y1="${mt}" y2="${Hh - mb}"/>`;
  const pts = r.mocks.map(m => [X(parse(m.date)), Y(+m.score), m]);
  s += `<polyline class="series" points="${pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ")}"/>`;
  const lastP = pts[pts.length - 1];
  if (r.upcoming && r.Eexam != null) {
    const px = X(r.exam), py = Y(r.Eexam);
    s += `<line class="pace" x1="${lastP[0]}" y1="${lastP[1]}" x2="${px}" y2="${py}"/><circle class="projdot" cx="${px}" cy="${py}" r="5"/>`;
    s += `<text class="lab" x="${px + 9}" y="${py - 7}">Exam ${nf1.format(r.Eexam)}%</text>`;
    s += `<circle class="hit" cx="${px}" cy="${py}" r="12" data-tip="${esc("Projected exam-day score: " + pct(r.Eexam) + " on " + fmtDate(r.exam))}"/>`;
  }
  pts.forEach(([x, y, m]) => {
    s += `<circle class="dot" cx="${x}" cy="${y}" r="4.5"/><circle class="hit" cx="${x}" cy="${y}" r="12" data-tip="${esc(fmtDate(m.date) + " · " + (m.provider || "Mock") + ": " + pct(+m.score))}"/>`;
  });
  if (!r.upcoming || r.Eexam == null) s += `<text class="lab" x="${lastP[0] + 9}" y="${lastP[1] + 4}">${nf1.format(+lastP[2].score)}%</text>`;
  return s + "</svg>";
}

function hoursChart(r) {
  if (!r.sessions.length) return '<div class="empty">No study sessions logged yet. Log a session below to see your hours against the pace you need.</div>';
  const W = 640, Hh = 230, ml = 42, mr = 86, mt = 14, mb = 28;
  const d0 = parse(r.sessions[0].date);
  const endD = r.exam && r.exam > d0 ? r.exam : addDays(r.now, 7);
  const x0 = addDays(d0, -2), x1 = addDays(endD, 2);
  const yMax = Math.ceil(Math.max(r.target, r.Hx || 0, r.H) / 50) * 50;
  const X = d => ml + (W - ml - mr) * ((d - x0) / (x1 - x0));
  const Y = v => mt + (Hh - mt - mb) * (1 - v / yMax);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Cumulative study hours against target pace">`;
  const step = yMax > 300 ? 100 : 50;
  for (let v = 0; v <= yMax; v += step) s += `<line class="grid" x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${ml - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  for (let i = 0; i <= 4; i++) { const d = new Date(+x0 + (x1 - x0) * (i / 4)); s += `<text x="${X(d)}" y="${Hh - 8}" text-anchor="middle">${fmtShort(d)}</text>`; }
  // target pace: straight line from first session to target on exam day
  if (r.exam && r.exam > d0) {
    s += `<line class="pace" x1="${X(d0)}" y1="${Y(0)}" x2="${X(r.exam)}" y2="${Y(r.target)}"/>`;
    s += `<text class="lab" x="${X(r.exam) + 8}" y="${Y(r.target) + 4}">Target ${nf0.format(r.target)} h</text>`;
  }
  // cumulative by day
  const byDay = new Map();
  r.sessions.forEach(x => byDay.set(x.date, (byDay.get(x.date) || 0) + (Number(x.hours) || 0)));
  let cum = 0; const pts = [[X(d0), Y(0)]];
  [...byDay.keys()].sort().forEach(k => { cum += byDay.get(k); pts.push([X(parse(k)), Y(cum), k, cum]); });
  const line = pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const lastP = pts[pts.length - 1];
  s += `<polygon class="area" points="${line} ${lastP[0].toFixed(1)},${Y(0)} ${pts[0][0].toFixed(1)},${Y(0)}"/>`;
  s += `<polyline class="series" points="${line}"/>`;
  s += `<circle class="dot" cx="${lastP[0]}" cy="${lastP[1]}" r="4.5"/>`;
  s += `<text class="lab" x="${lastP[0] + 8}" y="${lastP[1] - 8}">${nf0.format(r.H)} h</text>`;
  pts.slice(1).forEach(p => { s += `<circle class="hit" cx="${p[0]}" cy="${p[1]}" r="7" data-tip="${esc(fmtDate(p[2]) + ": " + nf1.format(p[3]) + " h cumulative")}"/>`; });
  return s + "</svg>";
}

function kpis(r) {
  const need = weeklyNeeded(r);

  k.push(["Study hours", hrs(r.H), `of ${nf0.format(r.target)} h target${r.upcoming ? " · " + hrs(r.Hx) + " projected" : ""}`, r.H / r.target, r.upcoming ? r.Hx / r.target : null]);
  k.push(["Weekly pace", nf1.format(r.rate) + " h", need != null ? `last 4 weeks · need ${nf1.format(need)} h/week` : "average of the last 4 weeks"]);
  k.push(["Syllabus covered", pct(r.C * 100, 0), r.upcoming ? pct(r.Cx * 100, 0) + " projected by exam day" : "weighted by exam weight", r.C, r.upcoming ? r.Cx : null]);
  k.push(["Latest mock", r.mocks.length ? pct(+r.mocks[r.mocks.length - 1].score) : "—", r.mocks.length ? r.mocks.length + " taken · weighted average " + pct(r.M) : "none taken yet"]);

  return '<div class="kpis">' + k.map(([l, v, s, b, pj]) => `<div class="kpi"><span class="label">${l}</span><span class="v">${v}</span>${b != null ? `<div class="bar">${pj != null ? `<i class="proj" style="width:${clamp(pj, 0, 1) * 100}%"></i>` : ""}<i style="width:${clamp(b, 0, 1) * 100}%"></i></div>` : ""}<span class="s">${s}</span></div>`).join("") + "</div>";
}

    <details class="method"><summary>How the pass estimate works</summary>
      <ol>
        <li><b>Current score.</b> A weighted average of your last five mocks, with the most recent counting most. When topic scores cover at least half the exam weight, 30% of the estimate comes from those topic scores, weighted by each topic's share of the exam. With no mocks, practice scores on studied topics are blended with a guessing rate (${pct(L.guess, 0)}) for material not yet covered.</li>

      </ol>
      <p style="margin-top:8px">Treat the result as a guide. CFA Institute sets the pass mark after each exam and does not publish it.</p>
    </details>
  </section>`;

/* ---------- Events ---------- */
let undo = null, toastTimer = null;
function toast(msg, withUndo) {
  const el = document.getElementById("toast");
  el.innerHTML = `<span>${esc(msg)}</span>${withUndo ? '<button data-act="undo">Undo</button>' : ""}`;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; undo = null; }, 6000);
}
function commit() { save(); render(); }

document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab, true); });

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.tagName === "SELECT") return;
  const act = b.dataset.act, lvId = b.dataset.lv;
  if (act === "go") setTab(b.dataset.tab, true);
  else if (act === "start-fresh") { state = blankState(); commit(); toast("Example cleared. Your data now saves in this browser."); }
  else if (act === "keep-example") { state.example = false; commit(); }
  else if (act === "load-example") { state = exampleState(); commit(); }
  else if (act === "clear-arm") { ui.clearArmed = true; render(); }
  else if (act === "clear-cancel") { ui.clearArmed = false; render(); }
  else if (act === "clear-confirm") { ui.clearArmed = false; state = blankState(); commit(); toast("All data deleted."); }
  else if (act === "toggle-sessions") { ui.showAllSessions[lvId] = !ui.showAllSessions[lvId]; render(); }
  else if (act === "del-session" || act === "del-mock") {
    const list = state.levels[lvId][act === "del-session" ? "sessions" : "mocks"];
    const i = list.findIndex(x => x.id === b.dataset.id);
    if (i >= 0) { undo = { list, item: list[i], i }; list.splice(i, 1); commit(); toast(act === "del-session" ? "Session deleted." : "Mock deleted.", true); }
  }
  else if (act === "undo" && undo) { undo.list.splice(undo.i, 0, undo.item); undo = null; commit(); document.getElementById("toast").hidden = true; }
  else if (act === "pdf") exportPdf();
  else if (act === "csv") exportCsv();
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.tf === "cov") { const o = t.parentElement.querySelector("output"); if (o) o.textContent = t.value + "%"; }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "rep-scope") { ui.reportScope = t.value; return; }
  if (t.dataset.set) {
    if (t.dataset.set === "name") { state.name = t.value.trim(); save(); render(); return; }
    const lv = state.levels[t.dataset.lv];
    let v = t.value;
    if (t.dataset.set === "targetHours") v = clamp(Number(v) || LEVELS[t.dataset.lv].hours, 50, 1000);
    if (t.dataset.set === "mps") v = clamp(Number(v) || LEVELS[t.dataset.lv].mps, 50, 90);
    lv[t.dataset.set] = v;
    commit();
    return;
  }
  if (t.dataset.tf) {
    const tp = state.levels[t.dataset.lv].topics[t.dataset.topic];
    if (t.dataset.tf === "prac") tp.prac = t.value === "" ? null : clamp(Number(t.value), 0, 100);
    else tp[t.dataset.tf] = Number(t.value);
    commit();
  }
});

document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  const lv = state.levels[f.dataset.lv];
  const fd = new FormData(f);
  if (f.dataset.form === "session") {
    const h = Number(fd.get("hours"));
    if (!fd.get("date") || !(h > 0)) { toast("Enter a date and a number of hours above zero."); return; }
    lv.sessions.push({ id: uid(), date: fd.get("date"), hours: h, topic: fd.get("topic"), kind: fd.get("kind"), notes: String(fd.get("notes") || "").trim() });
    if (lv.status === "not-started") lv.status = "studying";
    commit(); toast("Session added.");
  } else {
    const sc = Number(fd.get("score"));
    if (!fd.get("date") || fd.get("score") === "" || isNaN(sc)) { toast("Enter a date and an overall score."); return; }
    const topics = {};
    topicsFor(Number(f.dataset.lv), lv).forEach(t => { const v = fd.get("t_" + t.id); if (v !== null && v !== "") topics[t.id] = clamp(Number(v), 0, 100); });
    lv.mocks.push({ id: uid(), date: fd.get("date"), provider: String(fd.get("provider") || "").trim(), score: clamp(sc, 0, 100), topics });
    if (lv.status === "not-started") lv.status = "studying";
    commit(); toast("Mock added.");
  }
});

/* ---------- Exports ---------- */
async function saveFile(filename, blob) {
  // Inside a claude.ai Artifact, use the platform's download prompt; elsewhere, a normal browser download.
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const dl = await window.claude.use("downloads");
      if (dl) {
        try { await dl.save({ filename, data: blob }); toast("Saved " + filename + "."); return; }
        catch (err) { if (err && (err.code === "declined" || err.code === "rate_limited")) { toast("Download cancelled."); return; } }
      }
    }
  } catch (e) { /* fall through */ }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Downloaded " + filename + ".");
}
function scopeIds() { return ui.reportScope === "all" ? [1, 2, 3] : [Number(ui.reportScope)]; }
function stamp() { return iso(today()); }

function exportCsv() {
  const cols = ["level", "record_type", "date", "topic", "activity_or_provider", "hours", "score_pct", "coverage_pct", "confidence", "practice_pct", "exam_weight", "metric", "value", "notes"];
  const rows = [cols];
  const q = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const r2 = v => v == null ? "" : Math.round(v * 10) / 10;
  scopeIds().forEach(id => {
    const r = compute(id), L = r.L;
    const tn = tid => tid === "mixed" ? "Mixed / review" : (r.T.find(t => t.id === tid) || { name: tid }).name;
    const sum = (m, v) => rows.push([L.name, "summary", stamp(), "", "", "", "", "", "", "", "", m, v, ""]);
    sum("status", STATUS[r.lv.status]); sum("exam_date", r.lv.examDate); sum("days_to_exam", r.upcoming ? r.daysLeft : "");
    sum("hours_logged", r2(r.H)); sum("target_hours", r.target); sum("projected_hours_at_exam", r2(r.Hx)); sum("weekly_pace_last_4_weeks", r2(r.rate));
    sum("syllabus_covered_pct", r2(r.C * 100)); sum("projected_coverage_pct", r2(r.Cx * 100));
    sum("mocks_taken", r.mocks.length); sum("weighted_mock_average_pct", r2(r.M));
    sum("expected_score_now_pct", r2(r.Enow)); sum("expected_score_exam_day_pct", r2(r.Eexam)); sum("assumed_pass_mark_pct", r.mps);
    sum("pass_probability_pct", r.P == null ? "" : r2(r.P * 100)); sum("assessment", r.band.t);
    r.rows.forEach(t => rows.push([L.name, "topic", "", t.name, "", r2(t.hours), t.score == null ? "" : t.score, t.cov, t.conf || "", t.prac == null ? "" : t.prac, t.lo + "-" + t.hi + "%", "", "", ""]));
    r.mocks.forEach(m => {
      rows.push([L.name, "mock", m.date, "Overall", m.provider, "", m.score, "", "", "", "", "", "", ""]);
      Object.entries(m.topics || {}).forEach(([tid, v]) => rows.push([L.name, "mock_topic", m.date, tn(tid), m.provider, "", v, "", "", "", "", "", "", ""]));
    });
    r.sessions.forEach(x => rows.push([L.name, "session", x.date, tn(x.topic), x.kind, x.hours, "", "", "", "", "", "", "", x.notes]));
  });
  const csv = "﻿" + rows.map(r => r.map(q).join(",")).join("\r\n");
  saveFile(`cfa-prep-data-${ui.reportScope === "all" ? "all-levels" : "level-" + ui.reportScope}-${stamp()}.csv`, new Blob([csv], { type: "text/csv" }));
}

function exportPdf() {
  if (!window.jspdf || !window.jspdf.jsPDF) { toast("The PDF tool did not load. Check your connection and reload the page."); return; }
  const doc = new window.jspdf.jsPDF({ unit: "pt", format: "a4" });
  const PW = 595, M = 44, CW = PW - 2 * M;
  const INK = [19, 26, 36], MUTED = [110, 122, 140], ACC = [20, 85, 143], LINE = [217, 223, 231], PROJ = [122, 91, 181];
  const BAND = { good: [29, 122, 76], warn: [154, 98, 0], bad: [179, 54, 46], "": [110, 122, 140] };
  const ids = scopeIds();
  const rs = ids.map(compute);
  const ascii = s => String(s).replace(/[–—]/g, "-").replace(/[·]/g, "|").replace(/×/g, "x");
  let y = M;

  function head(title, sub) {
    doc.setFillColor(...ACC); doc.rect(0, 0, PW, 6, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...MUTED);
    doc.text("CFA PREP TRACKER", M, M);
    doc.setFont("helvetica", "normal");
    doc.text(ascii((state.name ? state.name + "  |  " : "") + "Generated " + fmtDate(today())), PW - M, M, { align: "right" });
    doc.setFont("times", "bold"); doc.setFontSize(22); doc.setTextColor(...INK);
    doc.text(ascii(title), M, M + 30);
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...MUTED);
    doc.text(ascii(sub), M, M + 47);
    y = M + 66;
  }
  function h2(t) {
    if (y > 760) { doc.addPage(); y = M; }
    doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...INK); doc.text(ascii(t), M, y); y += 8;
  }
  function table(head, body, opts) {
    doc.autoTable(Object.assign({
      startY: y, head: [head], body: body.map(r => r.map(c => ascii(c))), margin: { left: M, right: M },
      styles: { font: "helvetica", fontSize: 8.5, cellPadding: 4, textColor: INK, lineColor: LINE, lineWidth: 0.5 },
      headStyles: { fillColor: [234, 238, 243], textColor: MUTED, fontStyle: "bold", fontSize: 7.5 },
      theme: "grid"
    }, opts || {}));
    y = doc.lastAutoTable.finalY + 20;
  }
  function chart(r) {
    const h = 150, x0 = M + 26, w = CW - 26 - 70, top = y + 6;
    if (!r.mocks.length) { doc.setFontSize(9); doc.setTextColor(...MUTED); doc.text("No mock exams recorded yet.", M, y + 12); y += 30; return; }
    const d0 = parse(r.mocks[0].date);
    let d1 = r.upcoming ? r.exam : parse(r.mocks[r.mocks.length - 1].date);
    const span = Math.max(14 * DAY, d1 - d0), a = +d0 - span * 0.05, b = +d1 + span * 0.05;
    const lo = Math.min(r.mps, ...r.mocks.map(m => +m.score)) < 45 ? 20 : 40;
    const X = d => x0 + w * ((+d - a) / (b - a)), Y = v => top + h * (1 - (v - lo) / (100 - lo));
    doc.setFontSize(7); doc.setTextColor(...MUTED); doc.setLineWidth(0.5); doc.setDrawColor(...LINE);
    for (let v = lo; v <= 100; v += 10) { doc.line(x0, Y(v), x0 + w, Y(v)); doc.text(String(v), x0 - 5, Y(v) + 2.5, { align: "right" }); }
    for (let i = 0; i <= 4; i++) { const d = new Date(a + (b - a) * i / 4); doc.text(fmtShort(d), X(d), top + h + 12, { align: "center" }); }
    doc.setDrawColor(...INK); doc.setLineDashPattern([4, 3], 0); doc.setLineWidth(1);
    doc.line(x0, Y(r.mps), x0 + w, Y(r.mps));
    doc.setLineDashPattern([], 0);
    doc.setFontSize(8); doc.setTextColor(...INK); doc.text("Pass " + r.mps + "%", x0 + w + 6, Y(r.mps) + 3);
    doc.setDrawColor(...ACC); doc.setLineWidth(1.6);
    const pts = r.mocks.map(m => [X(parse(m.date)), Y(+m.score)]);
    for (let i = 1; i < pts.length; i++) doc.line(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]);
    doc.setFillColor(...ACC); pts.forEach(p => doc.circle(p[0], p[1], 2.6, "F"));
    if (r.upcoming && r.Eexam != null) {
      const p = pts[pts.length - 1], px = X(r.exam), py = Y(r.Eexam);
      doc.setDrawColor(...PROJ); doc.setLineDashPattern([4, 3], 0); doc.line(p[0], p[1], px, py); doc.setLineDashPattern([], 0);
      doc.setFillColor(255, 255, 255); doc.circle(px, py, 3.2, "FD");
      doc.setTextColor(...PROJ); doc.text("Exam " + nf1.format(r.Eexam) + "%", px + 6, py - 5);
    }
    y = top + h + 30;
  }

  if (ids.length > 1) {
    head("Preparation report: all levels", "Status, performance and pass expectations across CFA Levels I, II and III");
    h2("Summary");
    table(["Level", "Status", "Exam date", "Hours", "Covered", "Mocks", "Latest mock", "Expected score", "Pass chance", "Assessment"],
      rs.map(r => [r.L.name, STATUS[r.lv.status], r.exam ? fmtDate(r.exam) : "-", nf0.format(r.H) + " / " + nf0.format(r.target), pct(r.C * 100, 0), String(r.mocks.length), r.mocks.length ? pct(+r.mocks[r.mocks.length - 1].score) : "-", pct(r.Eexam), r.lv.status === "passed" || r.P == null ? "-" : nf0.format(r.P * 100) + "%", r.band.t]));
  }

  rs.forEach((r, idx) => {
    if (ids.length > 1 || idx > 0) { doc.addPage(); y = M; }
    head("CFA " + r.L.name + " preparation report", r.L.format + (r.id === 3 ? " | " + PATHWAYS[r.lv.pathway] + " pathway" : ""));
    // Verdict
    const bc = BAND[r.band.k] || BAND[""];
    doc.setFillColor(243, 245, 248); doc.setDrawColor(...LINE); doc.roundedRect(M, y, CW, 64, 4, 4, "FD");
    doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.setTextColor(...MUTED);
    doc.text(r.lv.status === "passed" || r.lv.status === "not-passed" ? "RESULT" : "CHANCE OF PASSING", M + 14, y + 18);
    doc.setFont("times", "bold"); doc.setFontSize(26); doc.setTextColor(...bc);
    const big = r.lv.status === "passed" ? "Passed" : r.lv.status === "not-passed" ? "Not passed" : r.P == null ? "n/a" : nf0.format(r.P * 100) + "%";
    doc.text(big, M + 14, y + 48);
    doc.setFont("helvetica", "bold"); doc.setFontSize(10);
    doc.text(r.band.t, M + 150, y + 26);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...INK);
    const verdict = r.lv.status === "passed" ? "Exam taken " + fmtDate(r.lv.examDate) + "." :
      r.Eexam == null ? "Record a mock exam or practice scores to estimate your chance of passing." :
      "Expected " + (r.upcoming ? "exam-day " : "") + "score " + pct(r.Eexam) + " against an assumed pass mark of " + r.mps + "% (spread +/-" + nf1.format(r.sigma) + " pts).";
    doc.text(doc.splitTextToSize(ascii(verdict), CW - 170), M + 150, y + 42);
    y += 88;

    h2("Key figures");
    const need = weeklyNeeded(r);
    table(["Measure", "Value", "Measure", "Value"], [
      ["Status", STATUS[r.lv.status], "Exam date", r.exam ? fmtDate(r.exam) + (r.upcoming ? " (" + r.daysLeft + " days)" : "") : "Not set"],
      ["Hours logged", nf1.format(r.H) + " h of " + nf0.format(r.target) + " h", "Projected by exam day", r.upcoming ? nf0.format(r.Hx) + " h" : "-"],
      ["Weekly pace (last 4 weeks)", nf1.format(r.rate) + " h", "Weekly hours needed for target", need != null ? nf1.format(need) + " h" : "-"],
      ["Syllabus covered", pct(r.C * 100, 0), "Projected coverage at exam", r.upcoming ? pct(r.Cx * 100, 0) : "-"],
      ["Mocks taken", String(r.mocks.length), "Weighted mock average", pct(r.M)],
      ["Expected score now", pct(r.Enow), "Mock trend", r.slope == null ? "needs 3 mocks" : (r.slope >= 0 ? "+" : "") + nf1.format(r.slope) + " pts/week"]
    ], { columnStyles: { 0: { textColor: MUTED }, 2: { textColor: MUTED } } });

    h2("Mock exam scores");
    chart(r);

    h2("Topics");
    table(["Topic", "Weight", "Covered", "Confidence", "Practice", "Latest mock", "Hours"],
      r.rows.map(t => [t.name, t.lo + "-" + t.hi + "%", t.cov + "%", t.conf ? t.conf + "/5" : "-", t.prac == null ? "-" : t.prac + "%", t.mockScore == null ? "-" : t.mockScore + "%", nf1.format(t.hours)]),
      { columnStyles: { 1: { halign: "right" }, 2: { halign: "right" }, 3: { halign: "right" }, 4: { halign: "right" }, 5: { halign: "right" }, 6: { halign: "right" } },
        didParseCell: d => { if (d.section === "body" && d.column.index === 5) { const v = parseFloat(d.cell.raw); if (!isNaN(v)) d.cell.styles.textColor = BAND[scoreClass(v, r.mps)]; } } });

    if (r.mocks.length) {
      h2("Mock exam history");
      table(["Date", "Mock", "Score", "vs pass mark"], r.mocks.map(m => [fmtDate(m.date), m.provider || "Mock exam", pct(+m.score), (+m.score - r.mps >= 0 ? "+" : "") + nf1.format(+m.score - r.mps) + " pts"]),
        { columnStyles: { 2: { halign: "right" }, 3: { halign: "right" } } });
    }
    if (r.sessions.length) {
      h2("Study time by activity");
      table(["Activity", "Hours", "Share"], Object.entries(r.byKind).sort((a, b) => b[1] - a[1]).map(([k, v]) => [k, nf1.format(v), pct(v / r.H * 100, 0)]),
        { columnStyles: { 1: { halign: "right" }, 2: { halign: "right" } }, tableWidth: CW * 0.6 });
    }
    if (r.lv.status === "studying" || r.lv.status === "not-started") {
      h2("Where to focus next");
      if (r.focus.length) table(["#", "Topic", "Weight", "Why"], r.focus.map((f, i) => [String(i + 1), f.r.name, f.r.lo + "-" + f.r.hi + "%", f.why.join(", ")]), { columnStyles: { 0: { cellWidth: 20 } } });
      else { doc.setFontSize(9); doc.setTextColor(...MUTED); doc.text("Nothing stands out.", M, y + 4); y += 20; }
    }
  });

  // Footer on every page
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(...MUTED);
    doc.text("Pass estimates are a study aid, not an official prediction. CFA Institute does not publish the minimum passing score. Not affiliated with CFA Institute.", M, 820);
    doc.text(i + " / " + n, PW - M, 820, { align: "right" });
  }
  const name = `cfa-prep-report-${ui.reportScope === "all" ? "all-levels" : "level-" + ui.reportScope}-${stamp()}.pdf`;
  saveFile(name, doc.output("blob"));
}

/* ---------- Boot ---------- */
let start = "overview";
const hash = (location.hash || "").slice(1);
if (["overview", "l1", "l2", "l3", "reports"].includes(hash)) start = hash;
else { try { const t = localStorage.getItem(KEY + ":tab"); if (t) start = t; } catch (e) { /* ignore */ } }
if (!["overview", "l1", "l2", "l3", "reports"].includes(start)) start = "overview";
setTab(start, false);
})();
</script>
