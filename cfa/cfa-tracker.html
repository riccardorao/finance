<style>
/* Layout: sticky tab bar; each level page reads top-down: verdict, estimate build-up, sections, logs, attempt history. */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --surface-2: #EAEEF3;
  --ink: #131A24;
  --ink-2: #445063;
  --muted: #6E7A8C;
  --line: #D9DFE7;
  --accent: #14558F;
  --accent-soft: #DCE8F4;
  --proj: #7A5BB5;
  --good: #1D7A4C;
  --good-soft: #DDF1E5;
  --warn: #9A6200;
  --warn-soft: #F8EBCF;
  --bad: #B3362E;
  --bad-soft: #F8DEDB;
  --f-display: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1219; --surface: #151C26; --surface-2: #1D2633; --ink: #E7EBF1; --ink-2: #AEB8C6; --muted: #7F8A9B;
    --line: #283343; --accent: #6DB3E8; --accent-soft: #1A3047; --proj: #B39BE6;
    --good: #5CC98F; --good-soft: #163626; --warn: #E3AE4A; --warn-soft: #3A2D12; --bad: #F2837A; --bad-soft: #3D1D1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1219; --surface: #151C26; --surface-2: #1D2633; --ink: #E7EBF1; --ink-2: #AEB8C6; --muted: #7F8A9B;
  --line: #283343; --accent: #6DB3E8; --accent-soft: #1A3047; --proj: #B39BE6;
  --good: #5CC98F; --good-soft: #163626; --warn: #E3AE4A; --warn-soft: #3A2D12; --bad: #F2837A; --bad-soft: #3D1D1B;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; margin: 0; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; text-wrap: balance; margin: 0; letter-spacing: -0.02em; }
h1 { font-size: clamp(1.6rem, 3.4vw, 2.2rem); line-height: 1.15; }
h2 { font-size: 1.2rem; line-height: 1.25; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.pos { color: var(--good); } .neg { color: var(--bad); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 10px 16px 0; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 6px 24px; }
.brand { display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px; }
.brand b { font-family: var(--f-display); font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em; }
.brand span { font-size: 0.8rem; color: var(--muted); }
nav.tabs { display: flex; flex-wrap: wrap; gap: 2px; max-width: 100%; }
nav.tabs button { appearance: none; border: 0; background: none; font: inherit; font-weight: 600; color: var(--ink-2); padding: 10px 12px 11px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }

main { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: grid; gap: 22px; }
section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 16px; min-width: 0; align-content: start; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 22px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; }

.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 12px 16px; border-radius: var(--r); background: var(--accent-soft); color: var(--ink); border: 1px solid var(--line); }
.banner .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.note { padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); font-size: 0.88rem; color: var(--ink-2); }

/* Controls */
button.btn { appearance: none; font: inherit; font-weight: 700; font-size: 0.88rem; padding: 8px 14px; border-radius: var(--r); border: 1px solid var(--accent); background: var(--accent); color: var(--surface); cursor: pointer; }
button.btn.ghost { background: transparent; color: var(--accent); }
button.btn.quiet { background: transparent; color: var(--ink-2); border-color: var(--line); }
button.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
button.link { appearance: none; border: 0; background: none; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
button.x { appearance: none; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 4px 6px; border-radius: 4px; }
button.x:hover { color: var(--bad); background: var(--bad-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select { font: inherit; font-size: 0.9rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 7px 9px; min-width: 0; }
input[type="number"] { font-family: var(--f-mono); }
input[type="range"] { padding: 0; accent-color: var(--accent); border: 0; background: transparent; }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 0.75rem; font-weight: 700; color: var(--ink-2); }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 0.88rem; color: var(--ink-2); }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 10px; align-items: end; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; }
.acts-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Verdict */
.verdict { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2fr); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.verdict .big { padding: 22px; display: grid; gap: 8px; align-content: start; border-right: 1px solid var(--line); }
.verdict .big .pct { font-family: var(--f-display); font-size: 3.4rem; line-height: 1; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.verdict .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpi { padding: 16px 18px; border-left: 1px solid var(--line); border-top: 1px solid var(--line); display: grid; gap: 4px; align-content: start; min-width: 0; }
.kpi:nth-child(-n+3) { border-top: 0; }
.kpi:nth-child(3n+1) { border-left: 0; }
.kpi .v { font-family: var(--f-mono); font-size: 1.3rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 0.8rem; color: var(--muted); }
@media (max-width: 760px) {
  .verdict { grid-template-columns: 1fr; }
  .verdict .big { border-right: 0; border-bottom: 1px solid var(--line); }
  .verdict .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { border-left: 1px solid var(--line) !important; border-top: 1px solid var(--line) !important; }
  .kpi:nth-child(2n+1) { border-left: 0 !important; }
  .kpi:nth-child(-n+2) { border-top: 0 !important; }
}
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); width: fit-content; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }
.bar > i.proj { background: var(--proj); opacity: 0.35; }
.chip { font-family: var(--f-mono); font-size: 0.82rem; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }

/* Tables: become stacked cards on narrow screens, never scroll sideways */
table.rt { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
table.rt th { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.rt td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.rt tr:last-child td { border-bottom: 0; }
table.rt .n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
table.rt td input[type="number"] { width: 70px; }
@media (max-width: 760px) {
  table.rt thead { display: none; }
  table.rt, table.rt tbody, table.rt tr { display: block; width: 100%; }
  table.rt tr { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  table.rt tr:last-child { border-bottom: 0; }
  table.rt td { border: 0; padding: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-width: 0; text-align: right; }
  table.rt td::before { content: attr(data-l); color: var(--muted); font-size: 0.75rem; font-family: var(--f-body); text-align: left; }
  table.rt td.first { grid-column: 1 / -1; font-weight: 700; }
  table.rt td.first::before { content: none; }
  table.rt td.wide { grid-column: 1 / -1; }
}
table.rt td .pill { white-space: normal; text-align: left; }
.cov { display: flex; align-items: center; gap: 8px; min-width: 140px; }
.cov input { flex: 1; min-width: 80px; }
.cov output { font-family: var(--f-mono); font-size: 0.82rem; width: 40px; text-align: right; }

/* Estimate build-up */
.build { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.step { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(80px, 180px) 74px; gap: 12px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); }
.step:first-child { border-top: 0; }
.step .no { font-family: var(--f-mono); color: var(--muted); font-size: 0.82rem; }
.step .what b { display: block; font-weight: 700; }
.step .what span { font-size: 0.8rem; color: var(--muted); }
.step .v { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 500; }
.step.total { background: var(--surface-2); }
.step.total .v { font-weight: 700; font-size: 1.05rem; }
.wbar { position: relative; height: 10px; }
.wbar::before { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; border-left: 1px solid var(--line); }
.wbar i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.wbar i.up { background: var(--good); left: 50%; }
.wbar i.down { background: var(--bad); right: 50%; }
.wbar i.lvl { background: var(--accent); left: 0; opacity: 0.85; }
.wbar.lvl::before { content: none; }
@media (max-width: 560px) {
  .step { grid-template-columns: 22px minmax(0, 1fr) 64px; }
  .step .wbar, .step > div:empty { display: none; }
}

/* Charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ref { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .series { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: 0.1; }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .pace { stroke: var(--proj); stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
.chart .projdot { fill: var(--surface); stroke: var(--proj); stroke-width: 2; }
.chart .today { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .hit { fill: transparent; }
.chart text.lab { fill: var(--ink-2); font-family: var(--f-body); font-size: 11.5px; font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.8rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 18px; height: 0; border-top: 2px solid var(--accent); }
.legend i.dash { border-top: 2px dashed var(--proj); }
.legend i.ref { border-top: 2px dashed var(--ink-2); }
.empty { padding: 24px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); font-size: 0.9rem; }
#tip { position: fixed; pointer-events: none; z-index: 50; background: var(--ink); color: var(--bg); font-size: 0.8rem; padding: 6px 9px; border-radius: 5px; max-width: 240px; line-height: 1.35; }

/* Expandable groups */
.groups { display: grid; gap: 8px; }
details.grp { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
details.grp > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 12px; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
details.grp[open] > summary::before { transform: rotate(45deg); }
details.grp > summary .t { font-weight: 700; min-width: 0; }
details.grp > summary .t small { display: block; font-weight: 500; color: var(--muted); font-size: 0.8rem; }
details.grp > summary .m { font-family: var(--f-mono); font-size: 0.85rem; text-align: right; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: end; }
details.grp .body { padding: 0 12px 12px 36px; display: grid; gap: 10px; }
ul.sess { list-style: none; margin: 0; padding: 0; display: grid; }
ul.sess li { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto auto; gap: 2px 12px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 0.88rem; }
ul.sess li:first-child { border-top: 0; }
ul.sess li .d { font-family: var(--f-mono); font-size: 0.8rem; color: var(--ink-2); }
ul.sess li .w small { display: block; color: var(--muted); font-size: 0.8rem; }
ul.sess li .h { font-family: var(--f-mono); }
@media (max-width: 520px) { ul.sess li { grid-template-columns: minmax(0, 1fr) auto auto; } ul.sess li .d { grid-column: 1 / -1; } }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 6px 14px; }
.tgrid div { display: flex; justify-content: space-between; gap: 8px; font-size: 0.85rem; padding: 4px 0; border-bottom: 1px dashed var(--line); }
details.mock-topics summary, details.inline summary { cursor: pointer; font-size: 0.85rem; color: var(--accent); font-weight: 700; }
details.mock-topics { grid-column: 1 / -1; }
.mt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 8px; margin-top: 10px; }

/* Back-check */
.bc { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.bc div { padding: 12px 14px; display: grid; gap: 2px; border-left: 1px solid var(--line); margin-left: -1px; }
.bc .v { font-family: var(--f-mono); font-size: 1.15rem; }
.bc .s { font-size: 0.78rem; color: var(--muted); }

/* Overview */
.level-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; align-content: start; }
.level-card header { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.level-card .roman { font-family: var(--f-display); font-size: 2.4rem; line-height: 0.95; color: var(--accent); font-weight: 800; letter-spacing: -0.03em; }
.level-card dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 0.88rem; }
.level-card dt { color: var(--muted); }
.level-card dd { margin: 0; text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.journey { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.journey div { padding: 14px 16px; display: grid; gap: 4px; border-left: 1px solid var(--line); min-width: 0; }
.journey div:first-child { border-left: 0; }
.hero { display: grid; gap: 10px; }
.hero p { color: var(--ink-2); max-width: 65ch; }
.focus { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.focus li { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); }
.focus li b { grid-row: span 2; font-family: var(--f-mono); color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--r); display: flex; gap: 14px; align-items: center; z-index: 60; font-size: 0.88rem; max-width: calc(100% - 32px); }
.toast button { appearance: none; background: none; border: 0; color: var(--bg); font: inherit; font-weight: 800; text-decoration: underline; cursor: pointer; }
footer.foot { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; color: var(--muted); font-size: 0.8rem; display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .3s ease; } }
@media (max-width: 560px) { .journey { grid-template-columns: 1fr; } .journey div { border-left: 0; border-top: 1px solid var(--line); } .journey div:first-child { border-top: 0; } section.panel { padding: 16px; } details.grp .body { padding-left: 12px; } }
</style>

<script>
(function () {
"use strict";

/* ---------- Curriculum ---------- */
const PATHWAYS = { pm: "Portfolio Management", pmk: "Private Markets", pw: "Private Wealth" };
const LEVELS = {
  1: {
    name: "Level I", roman: "I", hours: 300, mps: 70, guess: 33.3, passNote: "roughly 40–45% in recent sessions",
    format: "180 multiple-choice questions in two 2h 15m sessions",
    topics: [
      ["ethics", "Ethical & Professional Standards", 15, 20], ["quant", "Quantitative Methods", 6, 9],
      ["econ", "Economics", 6, 9], ["fsa", "Financial Statement Analysis", 11, 14],
      ["corp", "Corporate Issuers", 6, 9], ["equity", "Equity Investments", 11, 14],
      ["fi", "Fixed Income", 11, 14], ["deriv", "Derivatives", 5, 8],
      ["alts", "Alternative Investments", 7, 10], ["pm", "Portfolio Management", 8, 12]
    ]

const KINDS = ["Reading", "Practice questions", "Mock exam", "Review", "Video lecture"];

function topicsFor(id, pathway) {

    id: tid, lo, hi, w: (lo + hi) / 2 / sum,

const KEY = "cfa-prep-tracker-v1";

function migrate(s) {

    [1, 2, 3].forEach(id => {
      const o = s.levels[id] || {};
      const a = Object.assign(blankAttempt(id), { examDate: o.examDate || "", targetHours: o.targetHours || LEVELS[id].hours, mps: o.mps || LEVELS[id].mps, topics: o.topics || blankTopics(id), sessions: o.sessions || [], mocks: o.mocks || [] });
      if (o.status === "passed" || o.status === "not-passed") a.result = { outcome: o.status === "passed" ? "passed" : "failed", actual: null, mps: null, passRate: null, bands: {} };
      s.levels[id] = { pathway: o.pathway || "pm", attempts: [a] };
    });

}

let state;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = migrate(JSON.parse(raw)); if (s) return s; } } catch (e) { /* storage unavailable */ }
  return exampleState();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* in-memory only */ } }
state = load();
function cur(id) { const a = state.levels[id].attempts; return a[a.length - 1]; }

/* ---------- Model ---------- */
function phi(z) {
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989423 * Math.exp(-z * z / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return z > 0 ? 1 - p : p;
}
function statusOf(at) {
  if (at.result) return at.result.outcome === "passed" ? "passed" : "failed";
  const ex = parse(at.examDate);
  if (ex && ex < today()) return "awaiting";
  return at.sessions.length || at.mocks.length ? "studying" : "not-started";
}
function bandEstimate(id, at) {
  if (!at.result || !at.result.bands) return null;
  const T = topicsFor(id, state.levels[id].pathway);
  let w = 0, acc = 0;
  T.forEach(t => { const b = BANDS[at.result.bands[t.id]]; if (b) { w += t.w; acc += t.w * b.mid; } });
  return w >= 0.7 ? acc / w : null;
}
function actualOf(id, at) {
  if (!at.result) return null;
  const a = num(at.result.actual);
  if (a != null) return { v: a, src: "entered" };
  const b = bandEstimate(id, at);
  return b != null ? { v: b, src: "bands" } : null;
}

// Back-check: how far the model's exam-day estimate was from your real score on past exams (all levels)
function calibration() {
  const list = [];
  [1, 2, 3].forEach(lid => state.levels[lid].attempts.forEach((a, i) => {
    const act = actualOf(lid, a);
    if (!act) return;
    const r = compute(lid, a, { calib: false });
    if (r.Eexam == null) return;
    list.push({ lid, n: i + 1, pred: r.Eexam, actual: act.v, err: act.v - r.Eexam });
  }));
  const n = list.length;
  const mean = n ? list.reduce((s, x) => s + x.err, 0) / n : 0;
  return { n, mean, adj: n ? clamp(mean * n / (n + 2), -6, 6) : 0, list };
}

function compute(id, at, opts) {
  opts = opts || {};
  at = at || cur(id);
  const L = LEVELS[id], g = L.guess, pathway = state.levels[id].pathway;
  const T = topicsFor(id, pathway);
  const now = today();
  const exam = parse(at.examDate);
  const daysLeft = exam ? Math.round((exam - now) / DAY) : null;
  const status = statusOf(at);
  const upcoming = daysLeft != null && daysLeft > 0 && !at.result;
  const weeksLeft = upcoming ? daysLeft / 7 : 0;
  const mps = Number(at.mps) || L.mps;
  const target = Number(at.targetHours) || L.hours;

  const sessions = at.sessions.slice().sort((a, b) => a.date.localeCompare(b.date));
  const mocks = at.mocks.slice().sort((a, b) => a.date.localeCompare(b.date));
  const H = sessions.reduce((s, x) => s + (Number(x.hours) || 0), 0);
  const ref = exam && exam < now ? exam : now;
  const cutoff = addDays(ref, -28);
  const rate = sessions.filter(x => { const d = parse(x.date); return d > cutoff && d <= ref; }).reduce((s, x) => s + (Number(x.hours) || 0), 0) / 4;
  const C = T.reduce((s, t) => s + t.w * (Number(at.topics[t.id].cov) || 0) / 100, 0);

  // Step 0: measured section scores (latest mock section score, else practice score)
  const rows = T.map(t => {
    const tp = at.topics[t.id];
    let mockScore = null;
    for (let i = mocks.length - 1; i >= 0; i--) { const v = num(mocks[i].topics && mocks[i].topics[t.id]); if (v != null) { mockScore = v; break; } }
    const prac = num(tp.prac);
    const h = sessions.filter(x => x.topic === t.id).reduce((s, x) => s + (Number(x.hours) || 0), 0);
    return Object.assign({}, t, { c: (Number(tp.cov) || 0) / 100, cov: Number(tp.cov) || 0, conf: Number(tp.conf) || 0, prac, mockScore, measured: mockScore != null ? mockScore : prac, hours: h });
  });

  // Mock average: last five, most recent weighted most
  const last = mocks.slice(-5);
  let M = null, sd = 0;
  if (last.length) {
    let ws = 0, acc = 0;
    last.forEach((m, i) => { ws += i + 1; acc += (i + 1) * Number(m.score); });
    M = acc / ws;
    if (last.length > 1) {
      const mean = last.reduce((s, m) => s + Number(m.score), 0) / last.length;
      sd = Math.sqrt(last.reduce((s, m) => s + (Number(m.score) - mean) ** 2, 0) / (last.length - 1));
    }
  }

  // Knowledge level on studied material, used for sections without a measured score
  const kOf = (score, c) => clamp((score - (1 - c) * g) / c, g, 95);
  const measuredRows = rows.filter(r => r.measured != null);
  const Wm = measuredRows.reduce((s, r) => s + r.w, 0);
  let Kfill = null;
  if (M != null) Kfill = kOf(M, Math.max(C, 0.2));
  else if (measuredRows.length) { const ks = measuredRows.map(r => r.c > 0.2 ? kOf(r.measured, r.c) : r.measured); Kfill = ks.reduce((s, k) => s + k, 0) / ks.length; }

  // Step 1: current level, by section and overall (anchored to the mock average when there are mocks)
  let Enow = null, source = "none";
  rows.forEach(r => { r.raw = r.measured != null ? r.measured : (Kfill != null ? g + r.c * (Kfill - g) : null); });
  if (M != null) {
    const shift = M - rows.reduce((s, r) => s + r.w * r.raw, 0);
    rows.forEach(r => { r.now = r.raw + shift; });
    Enow = M; source = "mocks";
  } else if (Wm >= 0.3) {
    rows.forEach(r => { r.now = r.raw; });
    Enow = rows.reduce((s, r) => s + r.w * r.now, 0); source = "practice";
  } else rows.forEach(r => { r.now = null; });

  // Steps 2–5: projection to exam day
  let Hx = H, Cx = C, gain = 0, penalty = 0, add = 0;
  if (upcoming) {
    add = rate * weeksLeft;
    Hx = H + add;
    const hpc = C > 0.05 && H > 0 ? H / C : target * 0.85;
    Cx = Math.min(1, C + add / hpc);
  }
  const f = C < 1 ? (Cx - C) / (1 - C) : 0;
  let slope = null;
  if (mocks.length >= 3) {
    const p = mocks.slice(-5).map(m => [(parse(m.date) - now) / DAY / 7, Number(m.score)]);
    const mx = p.reduce((s, q) => s + q[0], 0) / p.length, my = p.reduce((s, q) => s + q[1], 0) / p.length;
    const nu = p.reduce((s, q) => s + (q[0] - mx) * (q[1] - my), 0), de = p.reduce((s, q) => s + (q[0] - mx) ** 2, 0);
    slope = de > 0 ? clamp(nu / de, -1.5, 1.5) : 0;
  }
  if (upcoming && Enow != null) {
    gain = slope != null ? clamp(slope * weeksLeft * 0.5, -3, 4) : clamp(add / 60, 0, 3) * (Cx >= 0.999 ? 1 : 0.5);
    if (Cx - C > 0.1) gain = Math.min(gain, 2);
    if (Hx < 0.75 * target) penalty = -Math.min(4, (0.75 - Hx / target) * 16);
  }
  const cal = opts.calib === false || at.result ? { n: 0, adj: 0, mean: 0, list: [] } : calibration();
  const calib = state.useBackcheck && Enow != null ? cal.adj : 0;
  rows.forEach(r => {
    r.cx = r.c + (1 - r.c) * f;
    if (r.now == null) { r.exam = null; r.uplift = 0; return; }
    const k = r.c > 0.2 ? kOf(r.now, r.c) : (Kfill != null ? Kfill : r.now);
    r.uplift = 0.8 * (r.cx - r.c) * Math.max(0, k - g);
    r.exam = clamp(r.now + r.uplift + gain + penalty + calib, 0, 100);
    r.now = clamp(r.now, 0, 100);
  });
  const covUp = rows.reduce((s, r) => s + r.w * (r.uplift || 0), 0);
  const Eexam = Enow == null ? null : clamp(Enow + covUp + gain + penalty + calib, 0, 100);

  // Steps 6–7: margin, uncertainty and chance of passing
  const sBase = M != null ? 5 : 7, sCons = sd * 0.6, sTime = upcoming ? Math.min(4, weeksLeft * 0.25) : 0;
  const sigma = Math.sqrt(sBase ** 2 + sCons ** 2 + sTime ** 2);
  const P = Eexam != null ? phi((Eexam - mps) / sigma) : null;

  let band;
  if (status === "passed") band = { k: "good", t: "Passed" };
  else if (status === "failed") band = { k: "bad", t: "Did not pass" };
  else if (P == null) band = { k: "", t: "Not enough data" };
  else if (P >= 0.75) band = { k: "good", t: "On track" };
  else if (P >= 0.5) band = { k: "warn", t: "Borderline" };
  else band = { k: "bad", t: "At risk" };

  const focus = rows.map(r => {
    const est = r.exam != null ? r.exam : g + r.c * (mps - g);
    const pr = r.w * Math.max(0, mps + 5 - est) + r.w * (100 - r.cov) * 0.25 + r.w * (5 - (r.conf || 0)) * 1.5;
    const why = [];
    if (r.exam != null) why.push("projected " + pct(r.exam, 0) + " on exam day");
    if (r.measured != null && r.measured < mps) why.push("latest score " + pct(r.measured, 0));
    if (r.cov < 100) why.push(pct(r.cov, 0) + " of readings covered");
    if (r.measured == null) why.push("no practice or mock score yet");
    if (r.conf && r.conf <= 2) why.push("confidence " + r.conf + "/5");

  const byKind = {};
  sessions.forEach(x => { byKind[x.kind] = (byKind[x.kind] || 0) + (Number(x.hours) || 0); });

  // Back-check for an attempt with a recorded result
  let back = null;
  if (at.result) {
    const act = actualOf(id, at);
    const rmps = num(at.result.mps);
    const mpsUsed = rmps != null ? rmps : mps;
    back = {
      outcome: at.result.outcome, passRate: num(at.result.passRate), mpsUsed, mpsReported: rmps,

        if (bd && r.exam != null) chk = r.exam < bd.a ? "under" : r.exam > bd.b ? "over" : "match";
        return { r, b: bd, chk };
      })

  return { id, at, L, T, rows, now, exam, daysLeft, status, upcoming, weeksLeft, mps, target, sessions, mocks, H, rate, C, Cx, Hx, add, M, sd, Enow, Eexam, covUp, gain, penalty, calib, cal, slope, sigma, sBase, sCons, sTime, P, band, source, focus, byKind, g, back };
}

function weeklyNeeded(r) { return r.upcoming ? Math.max(0, (r.target - r.H) / Math.max(r.weeksLeft, 0.14)) : null; }
function scoreClass(v, mps) { return v == null ? "" : v >= mps + 5 ? "good" : v >= mps - 5 ? "warn" : "bad"; }

/* ---------- Charts ---------- */
function mockChart(r) {
  if (!r.mocks.length) return '<div class="empty">No mock exams yet. Record your first one below to see your score trend against the pass mark.</div>';
  const W = 640, Hh = 230, ml = 38, mr = 90, mt = 16, mb = 28;
  const d0 = parse(r.mocks[0].date);
  const d1 = r.upcoming ? r.exam : parse(r.mocks[r.mocks.length - 1].date);
  const span = Math.max(14 * DAY, d1 - d0);
  const x0 = new Date(+d0 - span * 0.06), x1 = new Date(+d1 + span * 0.04);
  const minS = Math.min(r.mps, ...r.mocks.map(m => +m.score), r.Eexam == null ? 100 : r.Eexam);
  const y0 = minS < 45 ? 20 : 40, y1 = 100;
  const X = d => ml + (W - ml - mr) * ((d - x0) / (x1 - x0));
  const Y = v => mt + (Hh - mt - mb) * (1 - (v - y0) / (y1 - y0));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Mock exam scores over time against the assumed pass mark">`;
  for (let v = y0; v <= y1; v += 10) s += `<line class="grid" x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${ml - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  for (let i = 0; i <= 4; i++) { const d = new Date(+x0 + (x1 - x0) * (i / 4)); s += `<text x="${X(d)}" y="${Hh - 8}" text-anchor="middle">${fmtShort(d)}</text>`; }
  s += `<line class="ref" x1="${ml}" x2="${W - mr}" y1="${Y(r.mps)}" y2="${Y(r.mps)}"/><text class="lab" x="${W - mr + 6}" y="${Y(r.mps) + 4}">Pass ${r.mps}%</text>`;
  if (r.upcoming && r.now >= x0) s += `<line class="today" x1="${X(r.now)}" x2="${X(r.now)}" y1="${mt}" y2="${Hh - mb}"/>`;
  const p = r.mocks.map(m => [X(parse(m.date)), Y(+m.score), m]);
  s += `<polyline class="series" points="${p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ")}"/>`;
  const lastP = p[p.length - 1];
  if (r.upcoming && r.Eexam != null) {
    const px = X(r.exam), py = Y(r.Eexam);
    s += `<line class="pace" x1="${lastP[0]}" y1="${lastP[1]}" x2="${px}" y2="${py}"/><circle class="projdot" cx="${px}" cy="${py}" r="5"/>`;
    const close = Math.abs(r.Eexam - r.mps) < 6, ly = close ? (r.Eexam < r.mps ? py + 17 : py - 11) : py - 7;
    s += `<text class="lab" x="${px + 9}" y="${ly}">Exam ${nf1.format(r.Eexam)}%</text>`;
    s += `<circle class="hit" cx="${px}" cy="${py}" r="12" data-tip="${esc("Projected exam-day score: " + pct(r.Eexam) + " on " + fmtDate(r.exam))}"/>`;
  } else s += `<text class="lab" x="${lastP[0] + 9}" y="${lastP[1] - 7}">${nf1.format(+lastP[2].score)}%</text>`;
  p.forEach(([x, y, m]) => { s += `<circle class="dot" cx="${x}" cy="${y}" r="4.5"/><circle class="hit" cx="${x}" cy="${y}" r="12" data-tip="${esc(fmtDate(m.date) + " · " + (m.provider || "Mock") + ": " + pct(+m.score))}"/>`; });
  return s + "</svg>";
}

function hoursChart(r) {
  if (!r.sessions.length) return '<div class="empty">No study sessions logged yet. Log one below to see your hours against the pace you need.</div>';
  const W = 640, Hh = 230, ml = 42, mr = 90, mt = 16, mb = 28;
  const d0 = parse(r.sessions[0].date);
  const endD = r.exam && r.exam > d0 ? r.exam : addDays(r.now, 7);
  const x0 = addDays(d0, -2), x1 = addDays(endD, 2);
  const yMax = Math.ceil(Math.max(r.target, r.Hx || 0, r.H) / 50) * 50;
  const X = d => ml + (W - ml - mr) * ((d - x0) / (x1 - x0));
  const Y = v => mt + (Hh - mt - mb) * (1 - v / yMax);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Cumulative study hours against target pace">`;
  const step = yMax > 300 ? 100 : 50;
  for (let v = 0; v <= yMax; v += step) s += `<line class="grid" x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${ml - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  for (let i = 0; i <= 4; i++) { const d = new Date(+x0 + (x1 - x0) * (i / 4)); s += `<text x="${X(d)}" y="${Hh - 8}" text-anchor="middle">${fmtShort(d)}</text>`; }
  if (r.exam && r.exam > d0) {
    s += `<line class="pace" x1="${X(d0)}" y1="${Y(0)}" x2="${X(r.exam)}" y2="${Y(r.target)}"/>`;
    s += `<text class="lab" x="${X(r.exam) + 8}" y="${Y(r.target) + 4}">Target ${nf0.format(r.target)} h</text>`;
  }
  const byDay = new Map();
  r.sessions.forEach(x => byDay.set(x.date, (byDay.get(x.date) || 0) + (Number(x.hours) || 0)));
  let cum = 0; const p = [[X(d0), Y(0)]];
  [...byDay.keys()].sort().forEach(k => { cum += byDay.get(k); p.push([X(parse(k)), Y(cum), k, cum]); });
  const line = p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ");
  const lastP = p[p.length - 1];
  s += `<polygon class="area" points="${line} ${lastP[0].toFixed(1)},${Y(0)} ${p[0][0].toFixed(1)},${Y(0)}"/>`;
  s += `<polyline class="series" points="${line}"/><circle class="dot" cx="${lastP[0]}" cy="${lastP[1]}" r="4.5"/>`;
  s += `<text class="lab" x="${lastP[0] + 8}" y="${lastP[1] - 8}">${nf0.format(r.H)} h</text>`;
  p.slice(1).forEach(q => { s += `<circle class="hit" cx="${q[0]}" cy="${q[1]}" r="7" data-tip="${esc(fmtDate(q[2]) + ": " + nf1.format(q[3]) + " h cumulative")}"/>`; });
  return s + "</svg>";
}

/* ---------- Views ---------- */
const app = document.getElementById("app");
const tip = document.getElementById("tip");
let tab = "overview";
const ui = { open: {}, clearArmed: false, reportScope: "all", newCarry: true, delArmed: null };
function isOpen(key, dflt) { return key in ui.open ? ui.open[key] : !!dflt; }
function det(key, dflt) { return `data-key="${key}"${isOpen(key, dflt) ? " open" : ""}`; }

function setTab(t, push) {
  tab = t;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  if (push) { try { history.replaceState(null, "", "#" + t); } catch (e) { /* ignore */ } }
  try { localStorage.setItem(KEY + ":tab", t); } catch (e) { /* ignore */ }
  render();
  window.scrollTo({ top: 0 });
}

function banner() {
  if (!state.example) return "";
  return `<div class="banner"><span><b>You are looking at example data.</b> Nothing here is yours yet. Start fresh to track your own preparation; it is saved in this browser only.</span>
    <span class="acts"><button class="btn" data-act="start-fresh">Start with my own data</button><button class="btn ghost" data-act="keep-example">Keep the example and edit it</button></span></div>`;
}
function tName(r, tid) { return tid === "mixed" ? "Mixed / review" : (r.T.find(t => t.id === tid) || { name: tid }).name; }
function statusPill(st) { return `<span class="pill ${st === "passed" ? "good" : st === "failed" ? "bad" : st === "studying" ? "info" : st === "awaiting" ? "warn" : ""}">${STATUS[st]}</span>`; }

function probBlock(r) {
  if (r.status === "passed" || r.status === "failed") {
    return `<div class="big"><span class="label">Result</span><span class="pct" style="color:var(--${r.status === "passed" ? "good" : "bad"})">${r.status === "passed" ? "Passed" : "Not passed"}</span>
      <span class="small muted">Exam taken ${fmtDate(r.at.examDate)}. The back-check below compares the estimate with your result.</span></div>`;
  }
  if (r.P == null) {
    return `<div class="big"><span class="label">Chance of passing</span><span class="pct muted">—</span><span class="pill">${r.band.t}</span>
      <span class="small muted">Record a mock exam, or practice scores for sections worth at least 30% of the exam, to get an estimate.</span></div>`;
  }
  const col = r.band.k ? `var(--${r.band.k})` : "var(--ink)";
  return `<div class="big"><span class="label">${r.status === "awaiting" ? "Pre-exam estimate" : "Chance of passing on exam day"}</span>
    <span class="pct" style="color:${col}">${nf0.format(r.P * 100)}%</span>
    <span class="pill ${r.band.k}">${r.band.t}</span>
    <span class="small muted">Projected score ${pct(r.Eexam)} against an assumed pass mark of ${r.mps}%. Pass rate for ${r.L.name}: ${r.L.passNote}.</span></div>`;
}

function kpis(r) {
  const need = weeklyNeeded(r);
  const k = [];
  k.push(["Exam date", r.exam ? fmtDate(r.exam) : "Not set", r.daysLeft == null ? "Set it in the settings below" : r.daysLeft > 0 ? r.daysLeft + " days to go" : r.daysLeft === 0 ? "Today" : "Taken " + Math.abs(r.daysLeft) + " days ago"]);
  k.push(["Study hours", hrs(r.H), `of ${nf0.format(r.target)} h target${r.upcoming ? " · " + hrs(r.Hx) + " projected" : ""}`, r.H / r.target, r.upcoming ? r.Hx / r.target : null]);
  k.push(["Weekly pace", nf1.format(r.rate) + " h", need != null ? `last 4 weeks · need ${nf1.format(need)} h/week` : "average of the last 4 weeks"]);
  k.push(["Syllabus covered", pct(r.C * 100, 0), r.upcoming ? pct(r.Cx * 100, 0) + " projected by exam day" : "weighted by exam weight", r.C, r.upcoming ? r.Cx : null]);
  k.push(["Latest mock", r.mocks.length ? pct(+r.mocks[r.mocks.length - 1].score) : "—", r.mocks.length ? r.mocks.length + " taken · weighted average " + pct(r.M) : "none taken yet"]);
  const mg = r.Eexam == null ? null : r.Eexam - r.mps;
  k.push(["Projected score", pct(r.Eexam), mg == null ? "needs mock or practice scores" : nf1.format(Math.abs(mg)) + " pts " + (mg >= 0 ? "above" : "below") + " the pass mark"]);
  return '<div class="kpis">' + k.map(([l, v, s, b, pj]) => `<div class="kpi"><span class="label">${l}</span><span class="v">${v}</span>${b != null ? `<div class="bar">${pj != null ? `<i class="proj" style="width:${clamp(pj, 0, 1) * 100}%"></i>` : ""}<i style="width:${clamp(b, 0, 1) * 100}%"></i></div>` : ""}<span class="s">${s}</span></div>`).join("") + "</div>";
}

function buildSteps(r) {
  const steps = [];
  steps.push({ n: 1, k: "Current level", v: r.Enow, lvl: true, note: r.source === "mocks" ? `Weighted average of your last ${Math.min(5, r.mocks.length)} mock${r.mocks.length > 1 ? "s" : ""}, latest counting most` : "Practice scores on studied sections; unstudied material at the guessing rate (" + pct(r.g, 0) + ")" });
  steps.push({ n: 2, k: "Syllabus still to cover", v: r.covUp, note: r.upcoming ? `Coverage ${pct(r.C * 100, 0)} → ${pct(r.Cx * 100, 0)} at ${nf1.format(r.rate)} h/week; new material counted at 80% of your level` : "No study time left before the exam" });
  steps.push({ n: 3, k: "Momentum", v: r.gain, note: !r.upcoming ? "No study time left before the exam" : r.slope != null ? `Mock trend ${r.slope >= 0 ? "+" : "−"}${nf1.format(Math.abs(r.slope))} pts/week, half carried forward, capped` : "Revision hours ahead (a mock trend needs 3 mocks)" });
  steps.push({ n: 4, k: "Hours shortfall", v: r.penalty, note: r.upcoming ? `${hrs(r.Hx)} projected against ${hrs(r.target)} target; applies below 75%` : "No study time left before the exam" });
  steps.push({ n: 5, k: "Back-check", v: r.calib, note: r.at.result ? "Not applied to an exam already sat" : r.cal.n ? `Real scores averaged ${pts(r.cal.mean)} against the estimate on ${r.cal.n} past exam${r.cal.n > 1 ? "s" : ""}; shrunk for small samples${state.useBackcheck ? "" : " (switched off)"}` : "No past exam results recorded yet" });
  return steps;
}

function buildView(r) {
  if (r.Enow == null) return `<div class="empty">The build-up appears once you record a mock exam or practice scores.</div>`;
  const max = 12;
  const row = s => {
    let bar;
    if (s.lvl) bar = `<div class="wbar lvl"><i class="lvl" style="width:${clamp(s.v, 0, 100)}%"></i></div>`;
    else { const w = clamp(Math.abs(s.v || 0) / max, 0, 1) * 50; bar = `<div class="wbar"><i class="${(s.v || 0) >= 0 ? "up" : "down"}" style="width:${w}%"></i></div>`; }
    return `<div class="step"><span class="no">${s.n}</span><div class="what"><b>${s.k}</b><span>${esc(s.note)}</span></div>${bar}<span class="v ${s.lvl ? "" : (s.v || 0) > 0.05 ? "pos" : (s.v || 0) < -0.05 ? "neg" : ""}">${s.lvl ? pct(s.v) : pts(s.v)}</span></div>`;
  };
  const margin = r.Eexam - r.mps;
  return `<div class="build">${buildSteps(r).map(row).join("")}
    <div class="step total"><span class="no">=</span><div class="what"><b>Projected exam-day score</b><span>Equals the weighted sum of the section projections below</span></div><div class="wbar lvl"><i class="lvl" style="width:${clamp(r.Eexam, 0, 100)}%"></i></div><span class="v">${pct(r.Eexam)}</span></div>
    <div class="step"><span class="no">6</span><div class="what"><b>Margin to pass mark</b><span>Assumed pass mark ${r.mps}% (CFA Institute does not publish it)</span></div><div class="wbar"><i class="${margin >= 0 ? "up" : "down"}" style="width:${clamp(Math.abs(margin) / max, 0, 1) * 50}%"></i></div><span class="v ${margin >= 0 ? "pos" : "neg"}">${pts(margin)}</span></div>
    <div class="step"><span class="no">7</span><div class="what"><b>Uncertainty</b><span>Exam-day noise ${nf1.format(r.sBase)}, mock inconsistency ${nf1.format(r.sCons)}, time to exam ${nf1.format(r.sTime)}, combined</span></div><div></div><span class="v">±${nf1.format(r.sigma)}</span></div>
    <div class="step total"><span class="no">=</span><div class="what"><b>Chance of passing</b><span>Probability that the exam-day score lands above the pass mark</span></div><div></div><span class="v">${pct(r.P * 100, 0)}</span></div>
  </div>
  ${r.cal.n && !r.at.result ? `<label class="check"><input id="use-bc" type="checkbox" data-act-change="backcheck"${state.useBackcheck ? " checked" : ""}> Apply the back-check from my past exams</label>` : ""}`;
}

function sectionsTable(r, id, editable) {
  return `<table class="rt">
    <thead><tr><th>Section</th><th class="n">Exam weight</th><th>Readings covered</th><th>Confidence</th><th class="n">Practice %</th><th class="n">Latest mock</th><th class="n">Now</th><th class="n">Exam day</th><th class="n">Hours</th></tr></thead>
    <tbody>${r.rows.map(t => `<tr>
      <td class="first">${esc(t.name)}</td>
      <td class="n" data-l="Exam weight">${t.lo}–${t.hi}%</td>
      <td data-l="Covered" class="wide">${editable ? `<div class="cov"><input id="cov-${id}-${t.id}" type="range" min="0" max="100" step="5" value="${t.cov}" data-topic="${t.id}" data-tf="cov" data-lv="${id}" aria-label="${esc(t.name)} readings covered"><output>${t.cov}%</output></div>` : pct(t.cov, 0)}</td>
      <td data-l="Confidence">${editable ? `<select id="conf-${id}-${t.id}" data-topic="${t.id}" data-tf="conf" data-lv="${id}" aria-label="${esc(t.name)} confidence">${[0, 1, 2, 3, 4, 5].map(v => `<option value="${v}"${t.conf === v ? " selected" : ""}>${v === 0 ? "–" : v + "/5"}</option>`).join("")}</select>` : (t.conf ? t.conf + "/5" : "—")}</td>
      <td class="n" data-l="Practice %">${editable ? `<input id="prac-${id}-${t.id}" type="number" min="0" max="100" step="1" value="${t.prac == null ? "" : t.prac}" data-topic="${t.id}" data-tf="prac" data-lv="${id}" aria-label="${esc(t.name)} practice score" placeholder="—">` : pct(t.prac, 0)}</td>
      <td class="n" data-l="Latest mock">${t.mockScore == null ? '<span class="muted">—</span>' : pct(t.mockScore, 0)}</td>
      <td class="n" data-l="Now">${t.now == null ? "—" : `<span class="chip ${scoreClass(t.now, r.mps)}">${pct(t.now, 0)}</span>`}</td>
      <td class="n" data-l="Exam day">${t.exam == null ? "—" : `<span class="chip ${scoreClass(t.exam, r.mps)}">${pct(t.exam, 0)}</span>`}</td>
      <td class="n" data-l="Hours">${nf1.format(t.hours)}</td></tr>`).join("")}</tbody>
  </table>`;
}

function sessionGroups(r, id, editable) {
  if (!r.sessions.length) return "";
  const groups = new Map();
  r.sessions.forEach(x => { const k = iso(weekStart(parse(x.date))); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(x); });
  const keys = [...groups.keys()].sort().reverse();
  const week = (k, i) => {
    const list = groups.get(k).slice().sort((a, b) => b.date.localeCompare(a.date));
    const h = list.reduce((s, x) => s + (Number(x.hours) || 0), 0);
    const by = {}; list.forEach(x => { by[x.topic] = (by[x.topic] || 0) + (Number(x.hours) || 0); });
    const top = Object.entries(by).sort((a, b) => b[1] - a[1])[0];
    return `<details class="grp" ${det("w-" + r.at.id + "-" + k, i === 0 && editable)}>
      <summary><span class="t">Week of ${fmtDate(k)}<small>Mostly ${esc(tName(r, top[0]))}</small></span><span class="m">${list.length} session${list.length > 1 ? "s" : ""} · ${nf1.format(h)} h</span></summary>
      <div class="body"><ul class="sess">${list.map(x => `<li><span class="d">${fmtDate(x.date)}</span><span class="w">${esc(tName(r, x.topic))}<small>${esc(x.kind)}${x.notes ? " · " + esc(x.notes) : ""}</small></span><span class="h">${nf1.format(+x.hours)} h</span>${editable ? `<button class="x" data-act="del-session" data-lv="${id}" data-id="${x.id}" aria-label="Delete session">×</button>` : "<span></span>"}</li>`).join("")}</ul></div>
    </details>`;
  };
  // Latest six weeks shown individually; older weeks folded into one expandable group
  const recent = keys.slice(0, 6), older = keys.slice(6);
  let html = recent.map(week).join("");
  if (older.length) {
    const oh = older.reduce((s, k) => s + groups.get(k).reduce((t, x) => t + (Number(x.hours) || 0), 0), 0);
    const on = older.reduce((s, k) => s + groups.get(k).length, 0);
    html += `<details class="grp" ${det("old-" + r.at.id, false)}><summary><span class="t">Earlier weeks<small>${fmtDate(older[older.length - 1])} to ${fmtDate(addDays(parse(older[0]), 6))}</small></span><span class="m">${on} sessions · ${nf1.format(oh)} h</span></summary><div class="body groups">${older.map((k, i) => week(k, i + 6)).join("")}</div></details>`;
  }
  return `<div class="groups">${html}</div>`;
}

function mockGroups(r, id, editable) {
  if (!r.mocks.length) return "";
  return `<div class="groups">${r.mocks.slice().reverse().map(m => {
    const tps = Object.entries(m.topics || {}).filter(([, v]) => num(v) != null);
    return `<details class="grp" ${det("m-" + m.id, false)}>
      <summary><span class="t">${esc(m.provider || "Mock exam")}<small>${fmtDate(m.date)}</small></span><span class="m"><span class="chip ${scoreClass(+m.score, r.mps)}">${pct(+m.score)}</span>${pts(+m.score - r.mps)}</span></summary>
      <div class="body">${tps.length ? `<div class="tgrid">${tps.map(([k, v]) => `<div><span>${esc(tName(r, k))}</span><span class="chip ${scoreClass(+v, r.mps)}">${pct(+v, 0)}</span></div>`).join("")}</div>` : '<span class="small muted">No section scores recorded for this mock.</span>'}
      ${editable ? `<div><button class="btn quiet" data-act="del-mock" data-lv="${id}" data-id="${m.id}">Delete this mock</button></div>` : ""}</div>
    </details>`;
  }).join("")}</div>`;
}

function backcheckView(r) {
  const b = r.back;
  if (!b) return "";
  const passed = b.outcome === "passed";
  const pr = b.Ppred == null ? "—" : nf0.format(b.Ppred * 100) + "%";
  const verdict = b.Ppred == null ? "There was not enough data before the exam to make an estimate." :
    (passed ? (b.Ppred >= 0.5 ? `The estimate called it: ${pr} chance of passing, and you passed.` : `You beat the estimate: it gave you ${pr} and you passed.`)
            : (b.Ppred < 0.5 ? `The estimate called it: ${pr} chance of passing, and you did not pass.` : `The estimate was too optimistic: it gave you ${pr} and you did not pass.`));
  const chk = { match: '<span class="pill good">Matched</span>', over: '<span class="pill warn">Estimate too high</span>', under: '<span class="pill info">Estimate too low</span>' };
  return `<p>${esc(verdict)}</p>
  <div class="bc">
    <div><span class="label">Estimated score</span><span class="v">${pct(b.pred)}</span><span class="s">model on exam day</span></div>
    <div><span class="label">Actual score</span><span class="v">${pct(b.actual)}</span><span class="s">${b.actualSrc === "entered" ? "as you entered it" : b.actualSrc === "bands" ? "estimated from section bands" : "add a score or section bands"}</span></div>
    <div><span class="label">Estimate error</span><span class="v ${b.err == null ? "" : Math.abs(b.err) <= 3 ? "pos" : "neg"}">${pts(b.err)}</span><span class="s">actual minus estimate</span></div>
    <div><span class="label">Pass mark</span><span class="v">${pct(b.mpsUsed, 0)}</span><span class="s">${b.mpsReported != null ? "reported or estimated for that session" : "assumed (no session figure entered)"}</span></div>
    <div><span class="label">Your margin</span><span class="v ${b.margin == null ? "" : b.margin >= 0 ? "pos" : "neg"}">${pts(b.margin)}</span><span class="s">actual against pass mark</span></div>
    <div><span class="label">Session pass rate</span><span class="v">${pct(b.passRate, 0)}</span><span class="s">${b.passRate == null ? "add it from the CFA Institute results release" : "of candidates passed"}</span></div>
  </div>
  <table class="rt">
    <thead><tr><th>Section</th><th class="n">Weight</th><th class="n">Estimated on exam day</th><th>Your result band</th><th>Check</th></tr></thead>
    <tbody>${b.sections.map(s => `<tr><td class="first">${esc(s.r.name)}</td><td class="n" data-l="Weight">${s.r.lo}–${s.r.hi}%</td><td class="n" data-l="Estimated">${s.r.exam == null ? "—" : `<span class="chip ${scoreClass(s.r.exam, b.mpsUsed)}">${pct(s.r.exam, 0)}</span>`}</td><td data-l="Result band">${s.b ? s.b.t : '<span class="muted">—</span>'}</td><td data-l="Check">${s.chk ? chk[s.chk] : '<span class="muted">—</span>'}</td></tr>`).join("")}</tbody>
  </table>`;
}

function resultForm(r, id, at) {
  const res = at.result || {};
  return `<form class="form-row" data-form="result" data-lv="${id}" data-at="${at.id}">
    <label class="field"><span>Outcome</span><select id="ro-${at.id}" name="outcome"><option value="passed"${res.outcome === "passed" ? " selected" : ""}>Passed</option><option value="failed"${res.outcome === "failed" ? " selected" : ""}>Did not pass</option></select></label>
    <label class="field"><span>Session pass rate (%)</span><input id="rp-${at.id}" name="passRate" type="number" min="0" max="100" step="1" value="${res.passRate == null ? "" : res.passRate}" placeholder="e.g. 44"></label>
    <label class="field"><span>Pass mark for that session (%)</span><input id="rm-${at.id}" name="mps" type="number" min="40" max="90" step="0.1" value="${res.mps == null ? "" : res.mps}" placeholder="${r.mps}"></label>
    <label class="field"><span>Your score, if known (%)</span><input id="ra-${at.id}" name="actual" type="number" min="0" max="100" step="0.1" value="${res.actual == null ? "" : res.actual}" placeholder="optional"></label>
    <details class="mock-topics" ${det("rb-" + at.id, true)}><summary>Section result bands from your score report</summary>
      <div class="mt-grid">${r.T.map(t => `<label class="field"><span>${esc(t.name)}</span><select id="rb-${at.id}-${t.id}" name="b_${t.id}"><option value="">—</option>${Object.entries(BANDS).map(([k, v]) => `<option value="${k}"${res.bands && res.bands[t.id] === k ? " selected" : ""}>${v.t}</option>`).join("")}</select></label>`).join("")}</div>
    </details>
    <div><button class="btn" type="submit">${at.result ? "Update result" : "Save result"}</button></div>
  </form>
  <p class="small muted">CFA Institute publishes the pass rate for each session but not the pass mark, so enter your own estimate of the pass mark if you have one. Without a score, the back-check estimates it from your section bands.</p>`;
}

function attemptHistory(id) {
  const lv = state.levels[id];
  const past = lv.attempts.slice(0, -1);
  if (!past.length) return "";
  return `<section class="panel">
    <div class="panel-head"><h2>Previous attempts</h2><span class="small muted">Kept separate: their hours, mocks and results do not count towards your current attempt.</span></div>
    <div class="groups">${past.map((a, i) => {
      const r = compute(id, a, { calib: false });
      const confirm = ui.delArmed === a.id;
      return `<details class="grp" ${det("a-" + a.id, false)}>
        <summary><span class="t">Attempt ${i + 1} · ${a.examDate ? fmtMonth(a.examDate) : "no date"}<small>${nf0.format(r.H)} h · ${r.mocks.length} mocks · estimate ${pct(r.Eexam)}${r.back && r.back.actual != null ? " · actual " + pct(r.back.actual) : ""}${r.back && r.back.passRate != null ? " · session pass rate " + pct(r.back.passRate, 0) : ""}</small></span><span class="m">${statusPill(r.status)}</span></summary>
        <div class="body">
          ${r.back ? backcheckView(r) : '<span class="small muted">No result recorded.</span>'}
          <details class="inline" ${det("ae-" + a.id, false)}><summary>Edit result</summary>${resultForm(r, id, a)}</details>
          <details class="inline" ${det("as-" + a.id, false)}><summary>Sessions and mocks from this attempt</summary><div style="display:grid;gap:12px;margin-top:10px">${sessionGroups(r, id, false) || '<span class="small muted">No sessions.</span>'}${mockGroups(r, id, false)}</div></details>
          <div class="acts-row">${confirm ? `<button class="btn danger" data-act="del-attempt" data-lv="${id}" data-id="${a.id}">Yes, delete attempt ${i + 1}</button><button class="btn quiet" data-act="del-attempt-cancel">Cancel</button>` : `<button class="btn quiet" data-act="del-attempt-arm" data-id="${a.id}">Delete this attempt</button>`}</div>
        </div>
      </details>`;
    }).join("")}</div>
  </section>`;
}

function levelView(id) {
  const r = compute(id), at = r.at, L = r.L;
  const lv = state.levels[id];

  const done = r.status === "passed" || r.status === "failed";

  const showResult = done || r.status === "awaiting";

  return `${banner()}
  <div class="hero">
    <span class="label">${n > 1 ? "Attempt " + n + " · " : ""}${STATUS[r.status]} · ${esc(L.format)}</span>

  ${showResult ? `<section class="panel">
    <div class="panel-head"><h2>${done ? "Exam result and back-check" : "Record your exam result"}</h2>${done ? statusPill(r.status) : ""}</div>

    ${r.status === "failed" ? `<div class="note acts-row" style="justify-content:space-between"><span>Start a new attempt to track your resit. This attempt's sessions, mocks and result move to <b>Previous attempts</b>.</span>
      <span class="acts-row"><label class="check"><input id="carry-${id}" type="checkbox" data-act-change="carry"${ui.newCarry ? " checked" : ""}> Carry over readings covered and confidence</label><button class="btn" data-act="new-attempt" data-lv="${id}">Start attempt ${n + 1}</button></span></div>` : ""}
    ${r.status === "passed" ? `<div class="note">${L.name} is complete. ${id < 3 ? `Set up <button class="link" data-act="go" data-tab="l${id + 1}">${LEVELS[id + 1].name}</button> next.` : "Congratulations on finishing the CFA exams."}</div>` : ""}

      ${mockChart(r)}
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Study hours</h2></div>
      <div class="legend"><span><i></i>Hours logged (cumulative)</span>${r.exam ? '<span><i class="dash"></i>Pace to reach your target</span>' : ""}</div>
      ${hoursChart(r)}
    </section>
  </div>

  ${!done ? `<section class="panel">
    <div class="panel-head"><h2>Where to focus next</h2><span class="small muted">Ranked by exam weight × gap to the pass mark, coverage and confidence.</span></div>
    ${r.focus.length ? `<ol class="focus">${r.focus.map((f, i) => `<li><b>${i + 1}</b><span><strong>${esc(f.r.name)}</strong> <span class="muted small">(${f.r.lo}–${f.r.hi}% of the exam)</span></span><span class="small muted">${esc(f.why.join(", "))}</span></li>`).join("")}</ol>` : '<div class="empty">Nothing stands out. Keep taking mocks to confirm.</div>'}
  </section>` : ""}

  <div class="grid2">
    <section class="panel">
      <div class="panel-head"><h2>Study sessions</h2><span class="small muted">${r.sessions.length} sessions · ${nf1.format(r.H)} h</span></div>
      ${!done ? `<form class="form-row" data-form="session" data-lv="${id}">
        <label class="field"><span>Date</span><input id="sd-${id}" name="date" type="date" required value="${iso(today())}"></label>
        <label class="field"><span>Hours</span><input id="sh-${id}" name="hours" type="number" min="0.25" max="16" step="0.25" required value="2"></label>
        <label class="field"><span>Section</span><select id="stp-${id}" name="topic">${topicOpts}</select></label>
        <label class="field"><span>Activity</span><select id="sk-${id}" name="kind">${KINDS.map(k => `<option>${k}</option>`).join("")}</select></label>

        <div><button class="btn" type="submit">Add session</button></div>

      <div class="panel-head"><h2>Mock exams</h2><span class="small muted">${r.mocks.length} recorded</span></div>

        <label class="field"><span>Date</span><input id="md-${id}" name="date" type="date" required value="${iso(today())}"></label>
        <label class="field"><span>Overall score (%)</span><input id="ms-${id}" name="score" type="number" min="0" max="100" step="0.1" required></label>
        <label class="field" style="grid-column:1/-1"><span>Provider or name</span><input id="mpv-${id}" name="provider" type="text" maxlength="80" placeholder="e.g. CFA Institute mock A"></label>
        <details class="mock-topics" ${det("mf-" + id, false)}><summary>Add section scores (optional, sharpens the section estimates)</summary>
          <div class="mt-grid">${r.T.map(t => `<label class="field"><span>${esc(t.name)}</span><input id="mt-${id}-${t.id}" name="t_${t.id}" type="number" min="0" max="100" step="1" placeholder="%"></label>`).join("")}</div>

        <div><button class="btn" type="submit">Add mock</button></div>

}

function overviewView() {
  const rs = [1, 2, 3].map(id => compute(id));
  const active = rs.filter(r => r.upcoming).sort((a, b) => a.daysLeft - b.daysLeft)[0];
  const totalH = [1, 2, 3].reduce((s, id) => s + state.levels[id].attempts.reduce((t, a) => t + a.sessions.reduce((u, x) => u + (Number(x.hours) || 0), 0), 0), 0);
  const passed = rs.filter(r => r.status === "passed").length;
  let headline;
  if (active) headline = `${active.L.name} in ${active.daysLeft} days. ${active.P != null ? "Chance of passing: " + nf0.format(active.P * 100) + "%." : "Record a mock to get a pass estimate."}`;
  else if (passed === 3) headline = "All three levels passed.";
  else headline = "Set an exam date on a level page to start tracking.";
  const cal = calibration();

  return `${banner()}
  <div class="hero">
    <span class="label">${state.name ? esc(state.name) + " · " : ""}${passed} of 3 levels passed · ${nf0.format(totalH)} hours logged across all attempts</span>
    <h1>${esc(headline)}</h1>
    <label class="field" style="max-width:320px"><span>Your name (shown on reports)</span><input id="cand-name" type="text" maxlength="80" data-set="name" value="${esc(state.name)}" placeholder="Your name"></label>
  </div>

  <div class="journey">${rs.map(r => { const n = state.levels[r.id].attempts.length; return `<div><span class="label">${r.L.name}${n > 1 ? " · attempt " + n : ""}</span>${statusPill(r.status)}<span class="small muted">${r.exam ? (r.upcoming ? "Exam " : "Exam taken ") + fmtDate(r.exam) : "No exam date set"}</span></div>`; }).join("")}</div>

  <div class="grid3">${rs.map(r => { const n = state.levels[r.id].attempts.length; const done = r.status === "passed" || r.status === "failed"; return `<article class="level-card">
    <header><div><span class="label">CFA</span><div class="roman">${r.L.roman}</div></div><span class="pill ${r.band.k}">${r.band.t}</span></header>
    <dl>
      <dt>Exam date</dt><dd>${r.exam ? fmtDate(r.exam) : "—"}</dd>
      <dt>Days to go</dt><dd>${r.upcoming ? r.daysLeft : "—"}</dd>
      <dt>Chance of passing</dt><dd>${r.status === "passed" ? "Passed" : done || r.P == null ? "—" : nf0.format(r.P * 100) + "%"}</dd>
      <dt>Projected score</dt><dd>${done ? "—" : pct(r.Eexam)}</dd>
      <dt>Latest mock</dt><dd>${r.mocks.length ? pct(+r.mocks[r.mocks.length - 1].score) : "—"}</dd>
      <dt>Attempts</dt><dd>${n}</dd>
    </dl>
    <div style="display:grid;gap:5px"><div style="display:flex;justify-content:space-between" class="small"><span class="muted">Hours (this attempt)</span><span class="mono">${nf0.format(r.H)} / ${nf0.format(r.target)}</span></div><div class="bar"><i style="width:${clamp(r.H / r.target, 0, 1) * 100}%"></i></div></div>
    <div style="display:grid;gap:5px"><div style="display:flex;justify-content:space-between" class="small"><span class="muted">Syllabus covered</span><span class="mono">${pct(r.C * 100, 0)}</span></div><div class="bar"><i style="width:${r.C * 100}%"></i></div></div>
    <div><button class="btn ghost" data-act="go" data-tab="l${r.id}">Open ${r.L.name}</button></div>
  </article>`; }).join("")}</div>

  ${cal.n ? `<section class="panel">
    <div class="panel-head"><h2>Back-check across your exams</h2><span class="small muted">How the estimate compared with your real results</span></div>
    <table class="rt"><thead><tr><th>Exam</th><th class="n">Estimate</th><th class="n">Actual</th><th class="n">Error</th></tr></thead>
    <tbody>${cal.list.map(x => `<tr><td class="first">${LEVELS[x.lid].name}, attempt ${x.n}</td><td class="n" data-l="Estimate">${pct(x.pred)}</td><td class="n" data-l="Actual">${pct(x.actual)}</td><td class="n" data-l="Error">${pts(x.err)}</td></tr>`).join("")}</tbody></table>
    <p class="small muted">Average error ${pts(cal.mean)}. ${state.useBackcheck ? `Current estimates are adjusted by ${pts(cal.adj)}.` : "The adjustment is switched off."}</p>
  </section>` : ""}

  <section class="panel">
    <div class="panel-head"><h2>Your data</h2></div>
    <p class="small muted" style="max-width:70ch">Everything is stored in this browser on this device. Download a CSV from Reports to keep a copy.</p>
    <div class="acts-row">
      <button class="btn quiet" data-act="load-example">Load example data</button>
      ${ui.clearArmed ? '<button class="btn danger" data-act="clear-confirm">Yes, delete everything</button><button class="btn quiet" data-act="clear-cancel">Cancel</button>' : '<button class="btn quiet" data-act="clear-arm">Delete all my data</button>'}

function reportsView() {

  return `${banner()}
  <div class="hero"><span class="label">Reports</span><h1>Export your progress</h1>
    <p>The PDF report covers performance, the estimate build-up, estimated section scores, study time, previous attempts with their back-check, and your current chance of passing. The CSV holds every session, mock, section and result record for Excel or Google Sheets.</p></div>

    <div class="acts-row" style="align-items:end">
      <label class="field"><span>Include</span><select id="rep-scope">
        <option value="all"${ui.reportScope === "all" ? " selected" : ""}>All levels</option>
        ${[1, 2, 3].map(i => `<option value="${i}"${ui.reportScope === String(i) ? " selected" : ""}>${LEVELS[i].name} only</option>`).join("")}
      </select></label>
      <button class="btn" data-act="pdf">Download PDF report</button>
      <button class="btn ghost" data-act="csv">Download CSV data</button>
    </div>
  </section>

    <div class="panel-head"><h2>Summary</h2><span class="small muted">Current attempt for each level, as of ${fmtDate(today())}</span></div>

      <tbody>${rs.map(r => { const done = r.status === "passed" || r.status === "failed"; return `<tr><td class="first">${r.L.name}${state.levels[r.id].attempts.length > 1 ? " · attempt " + state.levels[r.id].attempts.length : ""}</td><td data-l="Status">${STATUS[r.status]}</td><td data-l="Exam date">${r.exam ? fmtDate(r.exam) : "—"}</td><td class="n" data-l="Hours">${nf0.format(r.H)} / ${nf0.format(r.target)}</td><td class="n" data-l="Covered">${pct(r.C * 100, 0)}</td><td class="n" data-l="Mocks">${r.mocks.length}</td><td class="n" data-l="Projected">${done ? "—" : pct(r.Eexam)}</td><td class="n" data-l="Chance">${done || r.P == null ? "—" : nf0.format(r.P * 100) + "%"}</td><td data-l="Assessment"><span class="pill ${r.band.k}">${r.band.t}</span></td></tr>`; }).join("")}</tbody>

function render() {
  tip.hidden = true;
  if (tab === "overview") app.innerHTML = overviewView();
  else if (tab === "reports") app.innerHTML = reportsView();
  else app.innerHTML = levelView(Number(tab.slice(1)));
}

/* ---------- Events ---------- */
let undo = null, toastTimer = null;
function toast(msg, withUndo) {
  const el = document.getElementById("toast");
  el.innerHTML = `<span>${esc(msg)}</span>${withUndo ? '<button data-act="undo">Undo</button>' : ""}`;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; undo = null; }, 6000);
}
function commit() { save(); render(); }
function findAttempt(lvId, atId) { return state.levels[lvId].attempts.find(a => a.id === atId); }

document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab, true); });
document.addEventListener("toggle", e => { const d = e.target; if (d && d.dataset && d.dataset.key) ui.open[d.dataset.key] = d.open; }, true);

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.tagName === "SELECT" || b.tagName === "INPUT") return;
  const act = b.dataset.act, lvId = b.dataset.lv;
  if (act === "go") setTab(b.dataset.tab, true);
  else if (act === "start-fresh") { state = blankState(); commit(); toast("Example cleared. Your data now saves in this browser."); }
  else if (act === "keep-example") { state.example = false; commit(); }
  else if (act === "load-example") { state = exampleState(); commit(); }
  else if (act === "clear-arm") { ui.clearArmed = true; render(); }
  else if (act === "clear-cancel") { ui.clearArmed = false; render(); }
  else if (act === "clear-confirm") { ui.clearArmed = false; state = blankState(); commit(); toast("All data deleted."); }
  else if (act === "del-session" || act === "del-mock") {
    const list = cur(lvId)[act === "del-session" ? "sessions" : "mocks"];
    const i = list.findIndex(x => x.id === b.dataset.id);
    if (i >= 0) { undo = { list, item: list[i], i }; list.splice(i, 1); commit(); toast(act === "del-session" ? "Session deleted." : "Mock deleted.", true); }
  }
  else if (act === "undo" && undo) { undo.list.splice(undo.i, 0, undo.item); undo = null; commit(); document.getElementById("toast").hidden = true; }
  else if (act === "new-attempt") {
    const lv = state.levels[lvId], prev = cur(lvId), a = blankAttempt(Number(lvId));
    a.targetHours = prev.targetHours; a.mps = prev.mps;
    if (ui.newCarry) Object.keys(prev.topics).forEach(k => { a.topics[k] = { cov: prev.topics[k].cov, conf: prev.topics[k].conf, prac: null }; });
    lv.attempts.push(a);
    commit(); window.scrollTo({ top: 0 }); toast("Attempt " + lv.attempts.length + " started. Set your new exam date.");
  }
  else if (act === "del-attempt-arm") { ui.delArmed = b.dataset.id; render(); }
  else if (act === "del-attempt-cancel") { ui.delArmed = null; render(); }
  else if (act === "del-attempt") {
    const list = state.levels[lvId].attempts, i = list.findIndex(a => a.id === b.dataset.id);
    if (i >= 0 && list.length > 1) { undo = { list, item: list[i], i }; list.splice(i, 1); ui.delArmed = null; commit(); toast("Attempt deleted.", true); }
  }
  else if (act === "pdf") exportPdf();
  else if (act === "csv") exportCsv();
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.tf === "cov") { const o = t.parentElement.querySelector("output"); if (o) o.textContent = t.value + "%"; }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "rep-scope") { ui.reportScope = t.value; return; }
  if (t.dataset.actChange === "carry") { ui.newCarry = t.checked; return; }
  if (t.dataset.actChange === "backcheck") { state.useBackcheck = t.checked; commit(); return; }
  if (t.dataset.set) {
    if (t.dataset.set === "name") { state.name = t.value.trim(); commit(); return; }
    if (t.dataset.set === "pathway") { state.levels[3].pathway = t.value; commit(); return; }
    const at = cur(t.dataset.lv);
    let v = t.value;
    if (t.dataset.set === "targetHours") v = clamp(Number(v) || LEVELS[t.dataset.lv].hours, 50, 1000);

document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  const lvId = f.dataset.lv, at = f.dataset.at ? findAttempt(lvId, f.dataset.at) : cur(lvId);
  if (!at) return;
  const fd = new FormData(f);
  if (f.dataset.form === "session") {
    const h = Number(fd.get("hours"));
    if (!fd.get("date") || !(h > 0)) { toast("Enter a date and a number of hours above zero."); return; }
    at.sessions.push({ id: uid(), date: fd.get("date"), hours: h, topic: fd.get("topic"), kind: fd.get("kind"), notes: String(fd.get("notes") || "").trim() });
    commit(); toast("Session added.");
  } else if (f.dataset.form === "mock") {
    const sc = num(fd.get("score"));
    if (!fd.get("date") || sc == null) { toast("Enter a date and an overall score."); return; }
    const topics = {};
    topicsFor(Number(lvId), state.levels[lvId].pathway).forEach(t => { const v = num(fd.get("t_" + t.id)); if (v != null) topics[t.id] = clamp(v, 0, 100); });
    at.mocks.push({ id: uid(), date: fd.get("date"), provider: String(fd.get("provider") || "").trim(), score: clamp(sc, 0, 100), topics });
    commit(); toast("Mock added.");
  } else if (f.dataset.form === "result") {
    const bands = {};
    topicsFor(Number(lvId), state.levels[lvId].pathway).forEach(t => { const v = fd.get("b_" + t.id); if (v) bands[t.id] = v; });
    const n = k => { const v = num(fd.get(k)); return v == null ? null : clamp(v, 0, 100); };
    at.result = { outcome: fd.get("outcome"), passRate: n("passRate"), mps: n("mps"), actual: n("actual"), bands };
    commit(); toast("Result saved.");
  }
});

async function saveFile(filename, blob) {
  // Inside a claude.ai Artifact, use the platform's download prompt; elsewhere, a normal browser download.
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const dl = await window.claude.use("downloads");
      if (dl) {
        try { await dl.save({ filename, data: blob }); toast("Saved " + filename + "."); return; }
        catch (err) { if (err && (err.code === "declined" || err.code === "rate_limited")) { toast("Download cancelled."); return; } }
      }
    }
  } catch (e) { /* fall through */ }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Downloaded " + filename + ".");
}
